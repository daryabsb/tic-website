{% load wagtailcore_tags %}{# About: "What we do" beside the dated timeline (B-About). #}<div class="row about-story">
  <div class="stack about-story__col"><div><h2 class="h2 h2--sm">{{ value.heading }}</h2><div class="rule"></div></div><div class="rich">{{ value.body|richtext }}</div>{% if value.links %}<div class="row about-story__links">{% for link in value.links %}{% if link.page %}<a class="tri" href="{% pageurl link.page %}">{{ link.label }}</a>{% endif %}{% endfor %}</div>{% endif %}</div>
  <div class="about-story__col">{% include_block value.timeline %}</div>
</div>
