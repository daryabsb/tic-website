{% load wagtailcore_tags %}<div class="stack" style="gap:28px"><div><h2 class="h2 h2--sm">{{ value.heading }}</h2><div class="rule"></div></div><div class="row" style="gap:16px">{% for link in value.links %}<a class="sub" href="{% if link.page %}{% pageurl link.page %}{% else %}#{% endif %}"><b>{{ link.title }}</b>{% if link.text %}<span>{{ link.text }}</span>{% endif %}</a>{% endfor %}</div></div>
