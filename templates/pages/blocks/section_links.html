{% load wagtailcore_tags %}<div class="stack sec-links"><div><h2 class="h2 h2--sm">{{ value.heading }}</h2><div class="rule"></div></div><div class="row sec-links__row">{% for link in value.links %}{% if link.page %}<a class="sub" href="{% pageurl link.page %}">{% else %}<div class="sub">{% endif %}<b>{{ link.title }}</b>{% if link.text %}<span>{{ link.text }}</span>{% endif %}{% if link.page %}</a>{% else %}</div>{% endif %}{% endfor %}</div></div>
