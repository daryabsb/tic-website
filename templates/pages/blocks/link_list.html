{% load wagtailcore_tags %}<section class="section"><div class="wrap row links">
  <div class="stack links__intro"><div><h2 class="h2">{{ value.heading }}</h2><div class="rule"></div></div>{% if value.text %}<p class="muted">{{ value.text }}</p>{% endif %}</div>
  <div class="stack links__list">{% for link in value.links %}{% if link.page %}<a class="ind" href="{% pageurl link.page %}">{{ link.label }}<span class="ind__arrow" aria-hidden="true">→</span></a>{% else %}<div class="ind">{{ link.label }}</div>{% endif %}{% endfor %}</div>
</div></section>
