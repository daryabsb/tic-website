  - en: "About"
    ar: "من نحن"
  - en: "Our story"
    ar: "قصتنا"
  - en: "Founded in Dubai in [2020], TIC Quality Control is an independent testing, inspection and certification company with fourteen addresses in twelve countries. We measure; we do not guess — and every certificate we issue can be checked."
    ar: "تأسست تي آي سي لمراقبة الجودة في دبي عام [2020]، وهي شركة مستقلة للاختبار والفحص وإصدار الشهادات، لها أربعة عشر عنواناً في اثنتي عشرة دولة. نحن نقيس ولا نخمّن — وكل شهادة نصدرها يمكن التحقق منها."
