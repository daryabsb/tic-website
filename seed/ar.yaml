# Arabic: the pages that are translated first, and their text (master plan 08; T29, D81).
#
# `seed_site` makes each page under `pages` as a translation of the English page, with
# the text under `strings` (one English text has one Arabic text, on every page it is
# on). A text a translator changed in the admin or in the review sheet is kept.
#
# draft: every Arabic text here is a draft by Claude. It is on staging to be read; the
# reviewer in Baghdad approves it in the review sheet (admin: Translations), and Arabic
# becomes public in production only after that (P-5; SITE_PUBLIC_LANGUAGES).
#
# Rules of the draft: Western digits; a mark stays in Latin letters (TIC, COSQC, LOX,
# ISO/IEC 17020, AI-3314); a legal name stays as registered; a bracketed placeholder
# stays in brackets; a phone number is wrapped in U+2066 ... U+2069 so it reads left
# to right. Terms: `python manage.py arabic_pages` lists a text with no Arabic.
draft: true

# English paths; a parent before its children. Egypt and the Kurdistan Region program
# pages join when their English pages exist (P-13).
pages:
  - "/"
  - "/verify"
  - "/offices"
  - "/offices/baghdad"
  - "/offices/cairo"
  - "/offices/amman"
  - "/offices/riyadh"
  - "/offices/dubai"
  - "/offices/sharjah"
  - "/about"
  - "/about/accreditations"
  - "/about/impartiality"
  - "/about/privacy"
  - "/about/complaints"
  - "/programs"
  - "/programs/iraq-certificate-of-conformity"

# Texts that stay as they are in Arabic: marks, keys the site reads, source notes that
# no visitor sees, and addresses an office has not given in Arabic yet (P-7).
