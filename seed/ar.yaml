  # --- /about/accreditations
  - en: "For every mark we show, you can see the certificate number, the entity and sites it covers, its status and validity, a link to the register that issued it, the certificate itself, and the date we last checked. A table, not a row of logos."
    ar: "لكل علامة نعرضها يمكنك أن ترى رقم الشهادة، والكيان والمواقع التي تشملها، وحالتها وصلاحيتها، ورابط السجل الذي أصدرها، والشهادة نفسها، وتاريخ آخر تحقق أجريناه. جدول، لا صف شعارات."
  - en: "Accreditations, registrations and memberships"
    ar: "الاعتمادات والتسجيلات والعضويات"
  - en: "A mark that has no number and no register link is not shown anywhere on this site."
    ar: "العلامة التي ليس لها رقم ولا رابط سجل لا تُعرض في أي مكان من هذا الموقع."
  - en: "Our rule"
    ar: "قاعدتنا"
  - en: "A mark appears only with its number and a link to the register that issued it.\n“Registered” and “appointed” are not “accredited”; we use the regulator’s own word.\nEach row names an owner and shows the date it was last checked.\nIf something here does not match a register, tell the Quality/Accreditation Manager: [email]."
    ar: "لا تظهر العلامة إلا مع رقمها ورابط السجل الذي أصدرها.\n«مسجّل» و«معيّن» لا تعنيان «معتمد»؛ نستخدم الكلمة التي تستخدمها الجهة التنظيمية نفسها.\nكل صف يذكر مسؤولاً عنه ويعرض تاريخ آخر تحقق منه.\nإذا وجدت هنا ما لا يطابق سجلاً، فأخبر مدير الجودة/الاعتماد: [البريد الإلكتروني]."
  - en: "Marks we are permitted to show"
    ar: "العلامات المصرّح لنا بعرضها"
  - en: "Symbols are shown as supplied by each body, with the number beneath, following that body’s own rules of use."
    ar: "تُعرض الرموز كما قدّمتها كل جهة، والرقم تحتها، وفق قواعد الاستخدام الخاصة بتلك الجهة."
  # --- /about/impartiality
  - en: "Impartiality is the product. This page says how we protect every inspection and certification decision from commercial, financial or other pressure — including pressure from within our own group."
    ar: "الحياد هو المنتج. تبيّن هذه الصفحة كيف نحمي كل قرار فحص وكل قرار إصدار شهادة من الضغوط التجارية أو المالية أو غيرها — بما فيها الضغوط من داخل مجموعتنا."
  - en: "Issue 0, revision 0"
    ar: "الإصدار 0، المراجعة 0"
  - en: "TIC Quality Control Pvt. Ltd., India: TIC-PY-02 (PDF)"
    ar: "TIC Quality Control Pvt. Ltd.، الهند: TIC-PY-02 (PDF)"
  - en: "Our commitment"
    ar: "التزامنا"
  - en: "TIC Quality Control is the legal entity responsible for its inspection and product certification activities. Management and staff fully understand the importance of impartiality and ensure it in every inspection and certification activity."
    ar: "تي آي سي لمراقبة الجودة هي الكيان القانوني المسؤول عن أنشطتها في الفحص وإصدار شهادات المنتجات. تدرك الإدارة والموظفون تماماً أهمية الحياد ويضمنونه في كل نشاط فحص وإصدار شهادات."
  - en: "TIC Quality Control is structured and managed to safeguard its impartiality: an independent impartiality committee for product certification, separation of all interested parties from inspection and certification operations and decisions, and the mitigation of all risks to impartiality."
    ar: "تي آي سي لمراقبة الجودة منظَّمة ومُدارة بما يصون حيادها: لجنة حياد مستقلة لإصدار شهادات المنتجات، وفصل جميع الأطراف ذات المصلحة عن عمليات الفحص وإصدار الشهادات وقراراتها، والحدّ من جميع المخاطر التي تهدد الحياد."
  - en: "What we do not do"
    ar: "ما لا نقوم به"
  - en: "TIC Quality Control is an inspection and conformity assessment body. It is not involved in any part of the following:"
    ar: "تي آي سي لمراقبة الجودة جهة فحص وتقييم مطابقة. وهي لا تشارك في أي جزء مما يلي:"
  - en: "Design, manufacture, installation, distribution or maintenance of products, processes or services."
    ar: "تصميم المنتجات أو العمليات أو الخدمات أو تصنيعها أو تركيبها أو توزيعها أو صيانتها."
  - en: "Offering or provision of consultancy to its clients."
    ar: "عرض الاستشارات على عملائها أو تقديمها لهم."
  - en: "Offering or provision of management system consultancy or internal auditing to its clients where the inspection or certification scheme requires the evaluation of the client’s management system."
    ar: "عرض استشارات أنظمة الإدارة أو التدقيق الداخلي على عملائها أو تقديمها لهم، حيثما يتطلب نظام الفحص أو إصدار الشهادات تقييم نظام الإدارة لدى العميل."
  - en: "Our activities are not marketed or offered as linked with the activities of an organization that provides consultancy. We do not state or imply that certification would be simpler, easier, faster or less expensive if a specified consultancy organization were used."
    ar: "لا تُسوَّق أنشطتنا ولا تُعرض على أنها مرتبطة بأنشطة جهة تقدّم الاستشارات. ولا نصرّح ولا نلمّح بأن الحصول على الشهادة سيكون أبسط أو أسهل أو أسرع أو أقل تكلفة إذا استُعين بجهة استشارية بعينها."
  - en: "Related legal entities"
    ar: "الكيانات القانونية ذات الصلة"
  - en: "TIC Quality Control ensures that the activities of separate legal entities with which it has relationships do not compromise the impartiality of its inspection and certification activities. When a separate legal entity offers or produces the inspected or certified product, or offers consultancy, TIC Quality Control personnel in the review and certification decision are not involved in the activities of that entity."
    ar: "تضمن تي آي سي لمراقبة الجودة ألا تمسّ أنشطةُ الكيانات القانونية المستقلة التي تربطها بها علاقات بحياد أنشطتها في الفحص وإصدار الشهادات. وعندما يعرض كيان قانوني مستقل المنتج الخاضع للفحص أو للشهادة أو ينتجه، أو يقدّم الاستشارات، لا يشارك موظفو تي آي سي لمراقبة الجودة المعنيون بالمراجعة وبقرار إصدار الشهادة في أنشطة ذلك الكيان."
  - en: "Shared ownership of TIC Quality Control, Seacorr and LOX does not influence any inspection or certification decision. When TIC engages a group company or another subcontractor for part of an inspection or for laboratory testing, we tell the client in advance, and TIC remains responsible for the result."
    ar: "الملكية المشتركة لتي آي سي لمراقبة الجودة و Seacorr و LOX لا تؤثر في أي قرار فحص أو قرار إصدار شهادة. وعندما تستعين TIC بشركة من المجموعة أو بمقاول آخر من الباطن لجزء من فحص أو لاختبار مخبري، نخبر العميل مسبقاً، وتبقى TIC مسؤولة عن النتيجة."
  - en: "Rules our staff follow"
    ar: "قواعد يلتزم بها موظفونا"
  - en: "For two years, TIC Quality Control personnel are not used to review, report or decide on the inspection or certification of a product for which they have provided consultancy."
    ar: "لمدة سنتين، لا يُكلَّف موظفو تي آي سي لمراقبة الجودة بمراجعة فحص منتج أو شهادته، أو إعداد تقرير عنه، أو اتخاذ قرار فيه، إذا كانوا قد قدّموا استشارات بشأنه."
  - en: "Risks to impartiality from the actions of other persons, bodies or organizations are acted on immediately, as the risk to impartiality analysis requires."
    ar: "تُعالَج فوراً المخاطر التي تهدد الحياد والناشئة عن تصرفات أشخاص أو جهات أو مؤسسات أخرى، وفق ما يقتضيه تحليل مخاطر الحياد."
  - en: "All personnel, internal or external, and all committees that could influence inspection or certification are committed to act impartially."
    ar: "جميع العاملين، من داخل الشركة أو خارجها، وجميع اللجان التي قد تؤثر في الفحص أو إصدار الشهادات، ملتزمون بالتصرف بحياد."
  - en: "All personnel, including top management, staff and subcontractors, sign a declaration of no conflict of interest, a non-disclosure agreement and the code of ethics."
    ar: "جميع العاملين، بمن فيهم الإدارة العليا والموظفون والمقاولون من الباطن، يوقّعون إقراراً بعدم تضارب المصالح واتفاقية عدم إفصاح ومدونة الأخلاقيات."
  - en: "Raising a concern"
    ar: "الإبلاغ عن مخاوف"
  - en: "If you believe a decision was influenced by anything other than the evidence, tell the Quality/Accreditation Manager at [email]. Concerns may be raised anonymously."
    ar: "إذا رأيت أن قراراً تأثر بأي شيء غير الأدلة، فأخبر مدير الجودة/الاعتماد على [البريد الإلكتروني]. ويمكن الإبلاغ دون ذكر الاسم."
  # --- /about/privacy
  - en: "Privacy"
    ar: "الخصوصية"
  - en: "[How TIC Quality Control collects and uses personal data, under UAE and Saudi data-protection law and the European GDPR — to be supplied by Legal.]"
    ar: "[كيف تجمع تي آي سي لمراقبة الجودة البيانات الشخصية وتستخدمها، وفق قانونَي حماية البيانات في الإمارات والسعودية واللائحة الأوروبية GDPR — يقدّمه القسم القانوني.]"
  - en: "[What we collect]"
    ar: "[ما نجمعه]"
  - en: "[To be supplied by Legal.]"
    ar: "[يقدّمه القسم القانوني.]"
  - en: "[Cookies]"
    ar: "[ملفات تعريف الارتباط]"
  - en: "[Your rights]"
    ar: "[حقوقك]"
  # --- /about/complaints
  - en: "How to disagree with us, and what happens next. A complaint is about how we worked; an appeal is against a decision — an inspection result or a certificate refused, suspended or withdrawn. Both are handled by people who were not involved in the original work."
    ar: "كيف تعترض علينا، وماذا يحدث بعد ذلك. الشكوى تتعلق بطريقة عملنا؛ والاستئناف يكون ضد قرار — نتيجة فحص، أو شهادة رُفضت أو أُوقفت أو سُحبت. ويتولى الاثنين أشخاص لم يشاركوا في العمل الأصلي."
  - en: "About how we worked"
    ar: "عن طريقة عملنا"
  - en: "An inspector’s conduct, a delay, a report with an error, a reply that never came. Any client, authority or member of the public may complain."
    ar: "سلوك مفتش، أو تأخير، أو تقرير فيه خطأ، أو ردّ لم يصل. يحق لأي عميل أو جهة رسمية أو فرد من الجمهور أن يتقدم بشكوى."
  - en: "Against a decision"
    ar: "ضد قرار"
  - en: "An inspection result you believe is wrong, or a certificate refused, suspended or withdrawn. Only the party the decision concerns may appeal, within [n] days of the decision."
    ar: "نتيجة فحص ترى أنها خاطئة، أو شهادة رُفضت أو أُوقفت أو سُحبت. لا يحق الاستئناف إلا للطرف المعني بالقرار، خلال [n] يوماً من صدور القرار."
  - en: "What happens next"
    ar: "ماذا يحدث بعد ذلك"
  - en: "Acknowledged"
    ar: "الإقرار بالاستلام"
  - en: "You receive a written acknowledgement with a reference number."
    ar: "تتسلم إقراراً كتابياً بالاستلام مع رقم مرجعي."
  - en: "Within [n] working days"
    ar: "خلال [n] أيام عمل"
  - en: "Reviewed by someone not involved"
    ar: "مراجعة من شخص غير مشارك"
  - en: "The Quality/Accreditation Manager, or for an appeal the [appeals panel], gathers the file and may ask you for more."
    ar: "يجمع مدير الجودة/الاعتماد، أو [لجنة الاستئناف] في حالة الاستئناف، الملف وقد يطلب منك معلومات إضافية."
  - en: "Decided and explained"
    ar: "القرار وتعليله"
  - en: "You receive the decision and the reasons in writing. If we were wrong, we say so and put it right."
    ar: "تتسلم القرار وأسبابه كتابةً. وإذا كنا مخطئين، نقرّ بذلك ونصحّح الخطأ."
  - en: "Within [n] working days of acknowledgement"
    ar: "خلال [n] أيام عمل من الإقرار بالاستلام"
  - en: "Still not satisfied?"
    ar: "ما زلت غير راضٍ؟"
  - en: "You may take the matter to our accreditation body, ANAB, or to the regulator of the program concerned. We tell you how."
    ar: "يمكنك رفع الأمر إلى جهة اعتمادنا ANAB، أو إلى الجهة التنظيمية للبرنامج المعني. ونخبرك بالطريقة."
  - en: "Contact details in the decision letter"
    ar: "بيانات الاتصال في خطاب القرار"
  - en: "Timescales to be confirmed from the quality manual. Owned by the Quality/Accreditation Manager."
    ar: "تُؤكَّد المدد الزمنية من دليل الجودة. المسؤول: مدير الجودة/الاعتماد."
  - en: "Submit a complaint or appeal"
    ar: "تقديم شكوى أو استئناف"
  - en: "Tell us whether it is a complaint or an appeal, the certificate or report number if there is one, and what happened. You can add photos or documents."
    ar: "أخبرنا هل هي شكوى أم استئناف، ورقم الشهادة أو التقرير إن وُجد، وما الذي حدث. يمكنك إرفاق صور أو مستندات."
  - en: "Or write to [complaints email], or post to the head office address."
    ar: "أو راسلنا على [بريد الشكاوى]، أو بالبريد إلى عنوان المكتب الرئيسي."
  # --- /programs
  - en: "The Certificates of Conformity and Inspection that importing countries require before customs clearance. Each program page sets out the regulator and our appointment, who must comply, the route, the steps, the documents, the fees, the questions exporters ask and the office that answers."
    ar: "شهادات المطابقة والفحص التي تشترطها الدول المستوردة قبل التخليص الجمركي. تبيّن صفحة كل برنامج الجهة التنظيمية وتعييننا، ومن يجب عليه الامتثال، والمسار، والخطوات، والمستندات، والرسوم، والأسئلة التي يطرحها المصدّرون، والمكتب الذي يجيب."
  - en: "Baghdad · Customs"
    ar: "بغداد · الجمارك"
  - en: "Programs we run"
    ar: "البرامج التي نديرها"
  - en: "Saudi Arabia SFDA"
    ar: "السعودية · SFDA"
  - en: "Designation in progress"
    ar: "التعيين قيد الإجراء"
  - en: "[date]"
    ar: "[التاريخ]"
  - en: "Document review and advisory support until TIC appears on the SFDA list of designated bodies."
    ar: "مراجعة مستندات ودعم استشاري إلى أن تُدرج TIC في قائمة SFDA للجهات المعيّنة."
  - en: "We add a page only where we hold an appointment, or label it clearly as “document review and advisory support” where we do not."
    ar: "لا نضيف صفحة إلا حيث نحمل تعييناً، أو نصفها بوضوح بأنها «مراجعة مستندات ودعم استشاري» حيث لا نحمله."
  - en: "Regulatory updates"
    ar: "التحديثات التنظيمية"
  - en: "Dated notices of every change in our programs, signed by the office that owns the page."
    ar: "إشعارات مؤرخة بكل تغيير في برامجنا، موقّعة من المكتب المسؤول عن الصفحة."
  - en: "Not sure which program applies?"
    ar: "لست متأكداً أي برنامج ينطبق؟"
  - en: "Tell us the destination and the product. The office that handles that country answers within one working day."
    ar: "أخبرنا ببلد الوجهة والمنتج. يجيبك المكتب المسؤول عن ذلك البلد خلال يوم عمل واحد."
  # --- /programs/iraq-certificate-of-conformity
  - en: "Iraq Certificate of Conformity"
    ar: "شهادة المطابقة — العراق"
  - en: "Many products imported into Iraq need a Certificate of Conformity (CoC) before customs clearance. COSQC, Iraq’s Central Organization for Standardization and Quality Control, appointed TIC Quality Control and LOX to inspect, test and certify them."
    ar: "تحتاج منتجات كثيرة مستوردة إلى العراق إلى شهادة مطابقة (CoC) قبل التخليص الجمركي. وقد عيّن الجهاز المركزي للتقييس والسيطرة النوعية في العراق (COSQC) تي آي سي لمراقبة الجودة و LOX لفحصها واختبارها وإصدار شهاداتها."
  - en: "Baghdad · Iraq CoC"
    ar: "بغداد · شهادة المطابقة للعراق"
  - en: "COSQC / ICIGI. Document review, testing, inspection and the certificate, from the office nearest your goods."
    ar: "COSQC / ICIGI. مراجعة المستندات والاختبار والفحص وإصدار الشهادة، من أقرب مكتب إلى بضائعك."
  - en: "Central Organization for Standardization and Quality Control"
    ar: "الجهاز المركزي للتقييس والسيطرة النوعية"
  - en: "Request a certificate"
    ar: "اطلب شهادة"
  - en: "Talk to the Baghdad office"
    ar: "تحدّث مع مكتب بغداد"
  - en: "Appointed by COSQC"
    ar: "معيّنون من COSQC"
  - en: "The Iraq CoC program is run by COSQC, Iraq’s national standards body; in the trade it is also called ICIGI. COSQC appointed TIC Quality Control and LOX by contract no. 5 of 22 May 2024, for three years and subject to an annual review. Certificates have been issued since 5 September 2024."
    ar: "يدير برنامجَ شهادة المطابقة للعراق الجهازُ المركزي للتقييس والسيطرة النوعية (COSQC)، وهو الهيئة الوطنية للمواصفات في العراق؛ ويُعرف البرنامج في أوساط التجارة أيضاً باسم ICIGI. وقد عيّن COSQC تي آي سي لمراقبة الجودة و LOX بموجب العقد رقم 5 المؤرخ 22 مايو 2024، لمدة ثلاث سنوات مع مراجعة سنوية. وتصدر الشهادات منذ 5 سبتمبر 2024."
  - en: "Regulated products"
    ar: "المنتجات الخاضعة للتنظيم"
  - en: "Exporters, manufacturers, traders and their authorized representatives shipping regulated products to Iraq. Requirements depend on the product category, not on the port the goods leave from."
    ar: "المصدّرون والمصنّعون والتجار وممثلوهم المفوّضون الذين يشحنون منتجات خاضعة للتنظيم إلى العراق. تعتمد المتطلبات على فئة المنتج، لا على الميناء الذي تغادر منه البضائع."
  - en: "Electrical and electronic products"
    ar: "المنتجات الكهربائية والإلكترونية"
  - en: "[examples]"
    ar: "[أمثلة]"
  - en: "[IQS / standard numbers]"
    ar: "[IQS / أرقام المواصفات]"
  - en: "Household appliances"
    ar: "الأجهزة المنزلية"
  - en: "Construction and building materials"
    ar: "مواد الإنشاء والبناء"
  - en: "Food products"
    ar: "المنتجات الغذائية"
  - en: "Cosmetics and personal care products"
    ar: "مستحضرات التجميل ومنتجات العناية الشخصية"
  - en: "Chemicals"
    ar: "المواد الكيميائية"
  - en: "Toys and children’s products"
    ar: "الألعاب ومنتجات الأطفال"
  - en: "Automotive products"
    ar: "منتجات السيارات"
  - en: "Automotive components, tires and related products"
    ar: "مكوّنات السيارات والإطارات والمنتجات ذات الصلة"
  - en: "Consumer goods"
    ar: "السلع الاستهلاكية"
  - en: "Registered or unregistered goods"
    ar: "بضائع مسجّلة أو غير مسجّلة"
  - en: "The program has two routes. Answer the question and the request form opens on your route."
    ar: "للبرنامج مساران. أجب عن السؤال فيُفتح نموذج الطلب على مسارك."
  - en: "Are your goods registered with COSQC (you hold a Statement of Registration)?"
    ar: "هل بضائعك مسجّلة لدى COSQC (أي لديك بيان تسجيل)؟"
  - en: "Yes"
    ar: "نعم"
  - en: "registered goods: we verify the Statement of Registration, then the certificate is issued"
    ar: "بضائع مسجّلة: نتحقق من بيان التسجيل، ثم تصدر الشهادة"
  - en: "No, one shipment"
    ar: "لا، شحنة واحدة"
  - en: "unregistered goods: request for certification, review and testing, inspection, certificate"
    ar: "بضائع غير مسجّلة: طلب الشهادة، المراجعة والاختبار، الفحص، الشهادة"
  - en: "No, I ship regularly"
    ar: "لا، أشحن بانتظام"
  - en: "application for registration: request for registration, verification, Statement of Registration"
    ar: "طلب تسجيل: طلب التسجيل، التحقق، بيان التسجيل"
  - en: "Where are the goods now?"
    ar: "أين البضائع الآن؟"
  - en: "Tell us in the form"
    ar: "أخبرنا في النموذج"
  - en: "the TIC office for that country inspects"
    ar: "يتولى الفحص مكتب TIC في ذلك البلد"
  - en: "Find my route"
    ar: "اعرف مساري"
  - en: "How it works"
    ar: "كيف يجري العمل"
  - en: "Application and documents"
    ar: "الطلب والمستندات"
  - en: "You send the request for certification with the commercial invoice, packing list and product specifications. We confirm the route and the inspecting office."
    ar: "ترسل طلب الشهادة مع الفاتورة التجارية وقائمة التعبئة ومواصفات المنتج. ونؤكد لك المسار والمكتب الذي يتولى الفحص."
  - en: "Documentary review"
    ar: "مراجعة المستندات"
  - en: "We review the technical documents, test reports and labels against the Iraqi standards for the product category."
    ar: "نراجع المستندات الفنية وتقارير الاختبار وبطاقات البيان وفق المواصفات العراقية لفئة المنتج."
  - en: "Testing, where required"
    ar: "الاختبار، عند الاقتضاء"
  - en: "Products that need laboratory testing are tested in accredited laboratories; the results are part of the assessment."
    ar: "تُختبر المنتجات التي تحتاج إلى اختبار مخبري في مختبرات معتمدة؛ والنتائج جزء من التقييم."
  - en: "Pre-shipment inspection"
    ar: "الفحص قبل الشحن"
  - en: "The inspector checks quantity, packaging, labelling and shipment consistency before the goods leave the factory or warehouse."
    ar: "يتحقق المفتش من الكمية والتعبئة وبطاقات البيان واتساق الشحنة قبل أن تغادر البضائع المصنع أو المستودع."
  - en: "Certificate of Conformity issued"
    ar: "إصدار شهادة المطابقة"
  - en: "When everything conforms, the CoC is issued. At the Iraqi border, customs may make their own checks."
    ar: "عندما يكون كل شيء مطابقاً، تصدر شهادة المطابقة. وعند الحدود العراقية قد تُجري الجمارك فحوصها الخاصة."
  - en: "What you give us"
    ar: "ما تقدّمه لنا"
  - en: "Uploaded in the online request form, with no Word file to download and send back."
    ar: "تُرفع في نموذج الطلب الإلكتروني، دون ملف Word تنزّله ثم تعيد إرساله."
  - en: "Commercial invoice (a proforma invoice for a first review)"
    ar: "الفاتورة التجارية (فاتورة مبدئية للمراجعة الأولى)"
  - en: "Packing list"
    ar: "قائمة التعبئة"
  - en: "Product technical specifications and data sheets"
    ar: "المواصفات الفنية للمنتج وصحائف البيانات"
  - en: "Test reports from an ISO/IEC 17025 accredited laboratory"
    ar: "تقارير اختبار من مختبر معتمد وفق ISO/IEC 17025"
  - en: "Quality certificates"
    ar: "شهادات الجودة"
  - en: "Product labels, markings and photographs"
    ar: "بطاقات بيان المنتج وعلاماته وصوره"
  - en: "Manufacturer’s declaration"
    ar: "إقرار المصنّع"
  - en: "Transport documents (bill of lading or other)"
    ar: "مستندات النقل (بوليصة الشحن أو غيرها)"
  - en: "[Any further item the Baghdad office confirms]"
    ar: "[أي بند آخر يؤكده مكتب بغداد]"
  - en: "Client declaration form, completed and signed by the exporter"
    ar: "إقرار العميل، مستوفى وموقّع من المصدّر"
  - en: "Start the request form"
    ar: "ابدأ نموذج الطلب"
  - en: "What the inspector checks"
    ar: "ما يتحقق منه المفتش"
  - en: "Product identification against the documents"
    ar: "مطابقة هوية المنتج للمستندات"
  - en: "Quantity, packing and marking against the invoice and packing list"
    ar: "الكمية والتعبئة والعلامات مقابل الفاتورة وقائمة التعبئة"
  - en: "Labels and product marking"
    ar: "بطاقات البيان وعلامات المنتج"
  - en: "Visual quality and shipment consistency"
    ar: "الجودة الظاهرية واتساق الشحنة"
  - en: "Sampling and testing where the standard requires it, in ISO/IEC 17025 accredited laboratories"
    ar: "أخذ العينات والاختبار حيث تتطلب المواصفة ذلك، في مختبرات معتمدة وفق ISO/IEC 17025"
  - en: "[Arabic labelling and origin-mark rules, to be confirmed by the Baghdad office]"
    ar: "[قواعد بطاقات البيان بالعربية وعلامة المنشأ، يؤكدها مكتب بغداد]"
  - en: "What it costs"
    ar: "التكلفة"
  - en: "[Fee table or fee-structure download, where the regulator permits: the Government & Trade Programs director decides (P-13)]"
    ar: "[جدول الرسوم أو تنزيل هيكل الرسوم، حيث تسمح الجهة التنظيمية: يقرر مدير البرامج الحكومية والتجارية (P-13)]"
  - en: "Questions exporters ask"
    ar: "أسئلة يطرحها المصدّرون"
  - en: "What is the Iraq CoC Program?"
    ar: "ما هو برنامج شهادة المطابقة للعراق؟"
  - en: "The Iraq CoC Program is a conformity assessment scheme designed to verify that regulated products comply with applicable Iraqi standards and technical requirements before export. The program may include document review, testing, and pre-shipment inspection activities prior to the issuance of a Certificate of Conformity."
    ar: "برنامج شهادة المطابقة للعراق نظام لتقييم المطابقة يهدف إلى التحقق من أن المنتجات الخاضعة للتنظيم تستوفي المواصفات والمتطلبات الفنية العراقية المعمول بها قبل التصدير. وقد يشمل البرنامج مراجعة المستندات والاختبار والفحص قبل الشحن قبل إصدار شهادة المطابقة."
  - en: "What is a Certificate of Conformity Iraq?"
    ar: "ما هي شهادة المطابقة للعراق؟"
  - en: "A Certificate of Conformity Iraq is an official document issued after successful completion of the conformity assessment process. It demonstrates that products meet the relevant requirements applicable to their importation into Iraq."
    ar: "شهادة المطابقة للعراق وثيقة رسمية تصدر بعد إتمام عملية تقييم المطابقة بنجاح. وهي تبيّن أن المنتجات تستوفي المتطلبات ذات الصلة المطبّقة على استيرادها إلى العراق."
  - en: "Is a Certificate of Conformity required for exports to Iraq?"
    ar: "هل شهادة المطابقة مطلوبة للصادرات إلى العراق؟"
  - en: "Certain products may require a Certificate of Conformity before they can be imported into Iraq. Requirements vary according to product category and applicable regulations."
    ar: "قد تحتاج منتجات معيّنة إلى شهادة مطابقة قبل أن يمكن استيرادها إلى العراق. وتختلف المتطلبات بحسب فئة المنتج واللوائح المعمول بها."
  - en: "Who can apply for Iraq CoC certification?"
    ar: "من يمكنه التقدم بطلب شهادة المطابقة للعراق؟"
  - en: "Manufacturers, exporters, trading companies, and authorized representatives involved in exporting goods to Iraq may apply for certification, subject to applicable requirements."
    ar: "يمكن للمصنّعين والمصدّرين والشركات التجارية والممثلين المفوّضين المشاركين في تصدير البضائع إلى العراق التقدم بطلب الشهادة، وفق المتطلبات المعمول بها."
  - en: "What documents are required for Iraq CoC certification?"
    ar: "ما المستندات المطلوبة لشهادة المطابقة للعراق؟"
  - en: "Commonly requested documents include commercial invoices, packing lists, product specifications, test reports, quality certificates, product labels, and manufacturer declarations."
    ar: "تشمل المستندات المطلوبة عادةً الفواتير التجارية وقوائم التعبئة ومواصفات المنتج وتقارير الاختبار وشهادات الجودة وبطاقات بيان المنتج وإقرارات المصنّع."
  - en: "What is pre-shipment inspection?"
    ar: "ما هو الفحص قبل الشحن؟"
  - en: "Pre-shipment inspection is a verification process conducted before goods are exported. It may include checks on product quantity, packaging, labeling, markings, and shipment consistency."
    ar: "الفحص قبل الشحن عملية تحقق تُجرى قبل تصدير البضائع. وقد يشمل التحقق من كمية المنتج والتعبئة وبطاقات البيان والعلامات واتساق الشحنة."
  - en: "Is product testing required?"
    ar: "هل اختبار المنتج مطلوب؟"
  - en: "Testing requirements depend on the product category, applicable standards, and conformity assessment route. Some products may require laboratory testing to demonstrate compliance."
    ar: "تعتمد متطلبات الاختبار على فئة المنتج والمواصفات المعمول بها ومسار تقييم المطابقة. وقد تحتاج بعض المنتجات إلى اختبار مخبري لإثبات المطابقة."
  - en: "How long does the certification process take?"
    ar: "كم تستغرق عملية إصدار الشهادة؟"
  - en: "Processing times vary depending on document completeness, testing requirements, inspection scheduling, and product complexity."
    ar: "تختلف مدة الإنجاز بحسب اكتمال المستندات ومتطلبات الاختبار ومواعيد الفحص وتعقيد المنتج."
  - en: "What happens if non-conformities are identified?"
    ar: "ماذا يحدث إذا تبيّنت حالات عدم مطابقة؟"
  - en: "Where non-conformities are identified, corrective actions may be required before certification can proceed."
    ar: "عند تبيّن حالات عدم مطابقة، قد تلزم إجراءات تصحيحية قبل متابعة إصدار الشهادة."
  - en: "Can shipments be inspected after corrective actions?"
    ar: "هل يمكن فحص الشحنات بعد الإجراءات التصحيحية؟"
  - en: "Yes. In many cases, products may be re-evaluated after corrective actions have been implemented and verified."
    ar: "نعم. في حالات كثيرة يمكن إعادة تقييم المنتجات بعد تنفيذ الإجراءات التصحيحية والتحقق منها."
  - en: "What are Iraq import requirements?"
    ar: "ما متطلبات الاستيراد إلى العراق؟"
  - en: "Iraq import requirements may include compliance with technical regulations, product standards, documentation requirements, testing obligations, and conformity assessment procedures."
    ar: "قد تشمل متطلبات الاستيراد إلى العراق الامتثال للوائح الفنية ومواصفات المنتجات ومتطلبات المستندات والتزامات الاختبار وإجراءات تقييم المطابقة."
  - en: "Which products are commonly covered under the Iraq CoC Program?"
    ar: "ما المنتجات التي يشملها عادةً برنامج شهادة المطابقة للعراق؟"
  - en: "Common categories include electrical products, electronics, household appliances, construction materials, chemicals, cosmetics, food products, toys, and consumer goods."
    ar: "تشمل الفئات الشائعة المنتجات الكهربائية والإلكترونيات والأجهزة المنزلية ومواد البناء والمواد الكيميائية ومستحضرات التجميل والمنتجات الغذائية والألعاب والسلع الاستهلاكية."
  - en: "Can one certificate cover multiple products?"
    ar: "هل يمكن أن تشمل شهادة واحدة عدة منتجات؟"
  - en: "This depends on product classification, shipment details, and applicable certification requirements."
    ar: "يعتمد ذلك على تصنيف المنتج وتفاصيل الشحنة ومتطلبات الشهادة المعمول بها."
  - en: "What is the purpose of the Iraq CoC Program?"
    ar: "ما الغرض من برنامج شهادة المطابقة للعراق؟"
  - en: "The program helps promote product quality, consumer safety, regulatory compliance, and efficient customs procedures."
    ar: "يساعد البرنامج على تعزيز جودة المنتجات وسلامة المستهلك والامتثال التنظيمي وكفاءة الإجراءات الجمركية."
  - en: "Does certification guarantee customs clearance?"
    ar: "هل تضمن الشهادة التخليص الجمركي؟"
  - en: "Certification supports compliance verification but customs authorities may conduct additional checks in accordance with applicable regulations."
    ar: "تدعم الشهادة التحقق من المطابقة، لكن السلطات الجمركية قد تُجري فحوصاً إضافية وفق اللوائح المعمول بها."
  - en: "Can manufacturers apply directly?"
    ar: "هل يمكن للمصنّعين التقدم بالطلب مباشرة؟"
  - en: "Yes. Manufacturers may apply directly or work through exporters, traders, or authorized representatives depending on the circumstances."
    ar: "نعم. يمكن للمصنّعين التقدم بالطلب مباشرة أو عبر المصدّرين أو التجار أو الممثلين المفوّضين، بحسب الظروف."
  - en: "Why is documentation review important?"
    ar: "لماذا مراجعة المستندات مهمة؟"
  - en: "Documentation review helps verify product information, technical specifications, and compliance evidence before inspection and certification activities proceed."
    ar: "تساعد مراجعة المستندات على التحقق من معلومات المنتج والمواصفات الفنية وأدلة المطابقة قبل متابعة أنشطة الفحص وإصدار الشهادة."
  - en: "How can exporters prepare for certification?"
    ar: "كيف يستعد المصدّرون للحصول على الشهادة؟"
  - en: "Exporters should gather all required documentation, verify product compliance, and coordinate testing and inspection activities in advance."
    ar: "ينبغي للمصدّرين جمع كل المستندات المطلوبة، والتحقق من مطابقة المنتج، وتنسيق أنشطة الاختبار والفحص مسبقاً."
  - en: "Why choose TIC Quality Control?"
    ar: "لماذا تختار تي آي سي لمراقبة الجودة؟"
  - en: "TIC Quality Control offers inspection, testing, certification support, documentation review, and compliance assistance for exporters seeking Iraq CoC certification."
    ar: "تقدّم تي آي سي لمراقبة الجودة الفحص والاختبار ودعم إصدار الشهادات ومراجعة المستندات والمساعدة في المطابقة للمصدّرين الساعين إلى شهادة المطابقة للعراق."
  - en: "How do I start the Iraq CoC application process?"
    ar: "كيف أبدأ إجراءات طلب شهادة المطابقة للعراق؟"
  - en: "Exporters can contact TIC Quality Control to discuss product requirements, documentation needs, inspection scheduling, and certification procedures."
    ar: "يمكن للمصدّرين التواصل مع تي آي سي لمراقبة الجودة لمناقشة متطلبات المنتج والمستندات اللازمة ومواعيد الفحص وإجراءات إصدار الشهادة."
  - en: "What is the COSQC ICIGI CoC Program?"
    ar: "ما هو برنامج شهادة المطابقة COSQC ICIGI؟"
  - en: "The COSQC ICIGI CoC Program is a conformity assessment program for products exported to Iraq. It helps verify compliance with applicable Iraqi standards and import requirements before shipment."
    ar: "برنامج شهادة المطابقة COSQC ICIGI برنامج لتقييم مطابقة المنتجات المصدَّرة إلى العراق. وهو يساعد على التحقق من استيفاء المواصفات العراقية ومتطلبات الاستيراد المعمول بها قبل الشحن."
  - en: "Is the Iraq CoC Program the same as the COSQC ICIGI CoC Program?"
    ar: "هل برنامج شهادة المطابقة للعراق هو نفسه برنامج شهادة المطابقة COSQC ICIGI؟"
  - en: "The Iraq CoC Program is implemented under the framework of the COSQC ICIGI CoC Program and focuses on conformity assessment activities such as documentation review, testing, inspection, and certification."
    ar: "يُنفَّذ برنامج شهادة المطابقة للعراق ضمن إطار برنامج شهادة المطابقة COSQC ICIGI، ويركّز على أنشطة تقييم المطابقة مثل مراجعة المستندات والاختبار والفحص وإصدار الشهادة."
  - en: "Who manages the COSQC ICIGI CoC Program?"
    ar: "من يدير برنامج شهادة المطابقة COSQC ICIGI؟"
  - en: "The program operates under the authority of the Central Organization for Standardization and Quality Control (COSQC), Iraq's national standards body."
    ar: "يعمل البرنامج تحت سلطة الجهاز المركزي للتقييس والسيطرة النوعية (COSQC)، وهو الهيئة الوطنية للمواصفات في العراق."
  - en: "Is a Certificate of Origin also required alongside the CoC?"
    ar: "هل شهادة المنشأ مطلوبة أيضاً مع شهادة المطابقة؟"
  - en: "This depends on the product and destination requirements. Some shipments require both a Certificate of Origin and a Certificate of Conformity, so it is worth confirming both requirements before export."
    ar: "يعتمد ذلك على المنتج ومتطلبات بلد الوجهة. تحتاج بعض الشحنات إلى شهادة منشأ وشهادة مطابقة معاً، لذا يحسن التأكد من المتطلبين قبل التصدير."
  - en: "Who handles it"
    ar: "من يتولى ذلك"
  - en: "Program coordinator"
    ar: "منسّق البرنامج"
  - en: "Head office coordinator"
    ar: "منسّق المكتب الرئيسي"
  - en: "Gandhidham (Gujarat)"
    ar: "غانديدام (غوجارات)"
  - en: "Inspections in Gujarat"
    ar: "عمليات الفحص في غوجارات"
  - en: "This page summarises the program as we understand it on the date shown; the regulator’s own publications take precedence."
    ar: "تلخّص هذه الصفحة البرنامج كما نفهمه في التاريخ المبيَّن؛ ومنشورات الجهة التنظيمية نفسها هي المرجع عند الاختلاف."
  - en: "With LOX · contract no. 5"
    ar: "مع LOX · العقد رقم 5"
  - en: "Certificates issued since 5 September 2024"
    ar: "تصدر الشهادات منذ 5 سبتمبر 2024"
