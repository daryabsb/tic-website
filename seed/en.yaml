home:
  title: "TIC Quality Control"
  seo_title: "TIC Quality Control — Testing, inspection and certification"
  search_description: "Independent testing, inspection and certification from offices in 12 countries. Certificates of Conformity for Iraq, Egypt, Botswana and Libya. Every report can be checked."
  hero_eyebrow: "Testing · Inspection · Certification"
  hero_heading: "Independent proof, wherever your cargo goes."
  hero_sentence: "We inspect, test and certify goods for exporters, importers and governments from offices in 12 countries — and every report we issue can be checked."
  hero_caption: "Umm Qasr · Discharge survey"
  sections:
    - type: proof_strip
      value:
        items:
          - {body: "ANAB", line_1: "ISO/IEC 17020 · Type A inspection body", line_2: "Certificate AI-3314 · valid to Oct 2028", link_label: "View register", link_url: "https://anab.ansi.org/"}
          - {body: "GOEIC", line_1: "Egypt pre-shipment inspection register", line_2: "Record 73", link_label: "View register", link_url: "https://www.goeic.gov.eg/"}
          - {body: "COSQC", line_1: "Iraq Certificate of Conformity program", line_2: "Appointed inspection body · 2024", link_label: "View appointment", link_url: "https://cosqc.gov.iq/"}
          - {body: "TIC Council", line_1: "Full member", line_2: "TIC Quality Control UAE", link_label: "View directory", link_url: "https://www.tic-council.org/"}
    - type: cards
      value:
        heading: "What do you need?"
        link_label: "All services"
        link_page: "services"
        cards:
