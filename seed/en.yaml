  title: "About"
  seo_title: "Our story"
  intro: "Founded in Dubai in [2020], TIC Quality Control is an independent testing, inspection and certification company with fourteen addresses in twelve countries. We measure; we do not guess — and every certificate we issue can be checked."
  header_caption: "Dubai · Head office"
  sections:
    - type: story
      value:
        heading: "What we do, in one paragraph"
        body: "<p>We inspect goods before they ship and when they arrive, test them through named laboratories, certify them against the standards of the markets they are sold into, and issue the Certificates of Conformity that governments in Iraq, Egypt, Botswana and Libya require. Our clients are exporters, importers, traders, banks and the regulators themselves.</p><p>We are a Type A inspection body under ISO/IEC 17020 — fully independent of the parties we inspect for. Impartiality is the product.</p>"
