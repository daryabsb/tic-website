          - {caption: "Testing", title: "Testing", page: "services/testing", text: "Food and agricultural, consumer products, oil and gas, minerals and metals — through named partner laboratories."}
          - {caption: "Certification", title: "Certification", page: "services/certification", text: "Product conformity, halal and scheme certification for the markets you sell into."}
