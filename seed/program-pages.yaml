- slug: "botswana-certificate-of-conformity"
  title: "Botswana Certificate of Conformity"
  source:
  - "https://ticqc.ae/botswana-coc/"
  intro: "The Botswana Certificate of Conformity (CoC) is a mandatory compliance document required for all regulated products exported to Botswana. It is issued under the Standards (Compulsory Standards) Regulations (SCSR) of 2023, formerly SIIR, administered by the Botswana Bureau of Standards (BOBS)."
  country: "Botswana"
  summary: "Certificate of Conformity (CoC) and SCSR Compliance Certificate for regulated products exported to Botswana."
  regulator_name: "Botswana Bureau of Standards"
  regulator_abbreviation: "BOBS"
  appointment_status: "appointed"
  fact_appointed_note: "TIC's first contract in Africa"
  fact_status_note: "SCSR program fully enforceable since 1 April 2024"
  request_label: "Request a certificate"
  parts:
  - type: "appointment"
    value:
      heading: "Appointed by BOBS"
      text: "<p>TIC Quality Control has been appointed by the Botswana Bureau of Standards (BOBS) for the Certificate of Conformity (CoC) / Verification of Conformity (VoC) program in Botswana. TIC issues the Certificate of Conformity (CoC) and SCSR Compliance Certificate for regulated products exported to Botswana. This appointment is TIC's first contract in Africa.</p><p>The Standards (Compulsory Standards) Regulations (SCSR) of 2023 is a Botswana Bureau of Standards (BOBS) program that controls the quality of regulated products imported into and manufactured in Botswana. The SCSR program has been fully enforceable since 1st April 2024. BOBS has expanded and revised the regulated products list to cover a broad range of goods across multiple industries.</p>"
  - type: "who_must_comply"
    value:
      heading: "Regulated products"
      text: "All products listed require a Botswana CoC or Product Certificate for customs clearance and market access. Every consignment of regulated products must obtain a Product Certificate (PC) or CoC issued by an approved service provider. The SCSR program ensures products entering the Botswana market meet required Botswana standards (BOBS), international standards (ISO, IEC), or approved manufacturer specifications to safeguard consumer safety, health, and the environment."
      products:
      - group: "Mechanical products (firefighting equipment)"
        examples: "Fire hose reels, portable rechargeable fire extinguishers and their reconditioning, fire extinguishing media (powders, carbon dioxide, foam concentrates), automatic fire ball extinguishers, hydrants, hose couplings and connectors"
        standard: "BOS 5, BOS 304, BOS ISO 7203-1"
      - group: "Mechanical products (other)"
        examples: "Retro reflectors, regulators for liquefied petroleum gas (LPG), welding steel electrodes, window frames, door frames, building glazing materials, door locks, fire doors and shutters, flat woven webbing slings, round slings"
        standard: "BOS 320, BOS 118, BOS 89, BOS 36, BOS 44, BOS 161-1, BOS 161-2, BOS 161-3, BOS 215, BOS 397, BOS EN 1492-1, BOS EN 1492-2"
      - group: "Food products"
        examples: "Sorghum grains, raw cow's milk, pasteurised cow milk, yoghurt, sour milk (madila) and buttermilk, bottled water, pulses, milled maize, canned meat, canned fish, peanut butter, UHT milk products, rice"
        standard: "BOS 26, BOS 63, BOS 64, BOS 72, BOS 143, BOS 262, BOS 201, BOS 213, BOS 385, BOS 450, BOS 126, BOS 273"
      - group: "Agricultural products"
        examples: "Poultry feeds, cattle feeds, pig feeds, broiler breeder feeds, sheep and goats feed"
        standard: "BOS 8-1, BOS 25, BOS 190, BOS 225, BOS 650"
      - group: "Electrical products (plugs, sockets and cables)"
        examples: "13A plugs, socket outlets, adaptors and fused connection units; 16A plug and socket-outlet systems (conventional, IEC and dedicated system); electric cables with extruded solid dielectric insulation for fixed installations"
        standard: "BOS 41-1, BOS 41-2, BOS 41-3, BOS 41-4, BOS 495-1, BOS 495-2, BOS 495-4, BOS 589-2"
      - group: "Electrical products (switchgear)"
        examples: "Circuit-breakers; switches, disconnectors, switch-disconnectors and fuse-combination units; power switchgears; distribution boards"
        standard: "BOS 659-1, BOS IEC 60947-2, BOS IEC 60947-3, BOS IEC 61439-2, BOS IEC 61439-3"
      - group: "Electrical products (audio/video and hand-held electric tools)"
        examples: "Audio/video, information and communication technology equipment; drills, grinders, polishers, sanders, circular saws, hammers, concrete vibrators, chain saws, planers"
        standard: "BOS IEC 62368-1; BOS IEC 60745-2-1, 60745-2-3, 60745-2-4, 60745-2-5, 60745-2-6, 60745-2-12, 60745-2-13, 60745-2-14"
      - group: "Electrical products (household appliances)"
        examples: "Vacuum cleaners, electric irons, dishwashers, cooking ranges, hobs and ovens, kettles and coffee makers, washing machines, shavers and hair clippers, grills and toasters, floor treatment machines, tumble dryers, fryers, kitchen machines"
        standard: "BOS IEC 60335-2 series"
      - group: "Electrical products (household appliances, continued)"
        examples: "Water heaters, refrigerating appliances and ice makers, microwave ovens, sewing machines, battery chargers, room heaters, heat pumps, air-conditioners, dehumidifiers, pumps, clothes dryers and towel rails, ironers, oral hygiene appliances"
        standard: "BOS IEC 60335-2 series"
      - group: "Electrical products (other appliances)"
        examples: "Warming plates, surface cleaning appliances, massage appliances, projectors, insect killers, air-cleaning appliances, fixed and portable immersion heaters, electric fence energizers, fans, fabric steamers"
        standard: "BOS IEC 60335-2-12, BOS IEC 60335-2-39, BOS IEC 60335-2-42"
      - group: "Chemical products"
        examples: "Various chemical substances and preparations"
        standard: "Botswana standards or approved international equivalents"
      - group: "Automotive products"
        examples: "Automotive glass and tyres"
        standard: ""
      - group: "Building and construction products"
        examples: "Cement and other building and construction products"
        standard: ""
  - type: "routes"
    value:
      heading: "Certification routes"
      text: "The validity of a Botswana CoC depends on the certification route. Each CoC covers a specific consignment."
      button_label: "Find my route"
      questions:
      - question: "Which describes you as an exporter or manufacturer?"
        answers:
        - answer: "Frequent exporter or high-volume manufacturer"
          outcome: "Product Certificate (PC): valid for 3 to 6 months depending on product risk"
          route: ""
        - answer: "Registered or occasional exporter or manufacturer"
          outcome: "CoC in country of supply: issued based on conformity assessment in the exporting country"
          route: ""
        - answer: "Unregistered or occasional exporter or manufacturer"
          outcome: "CoC at destination: issued upon arrival at Botswana ports/borders"
          route: ""
  - type: "steps"
    value:
      heading: "How it works"
      steps:
      - title: "Application submission"
        text: "Submit your application to TIC along with the required documents, including a final or proforma invoice, test reports, quality certificates, analysis reports, packing list, and product details."
      - title: "Documentary review"
        text: "TIC reviews all submitted documents to ensure they meet the applicable Botswana standards or approved equivalent international standards."
      - title: "Control testing (if required)"
        text: "Depending on the product and risk level, TIC may require control testing to verify compliance with the applicable standards."
      - title: "Physical inspection"
        text: "A physical inspection of the goods may be conducted to verify conformity with the submitted documents and applicable standards."
      - title: "Conclusion of assessment"
        text: "Based on the review, testing, and inspection, TIC concludes the conformity assessment and determines compliance."
      - title: "CoC issuance"
        text: "Upon successful assessment, TIC issues the Botswana Certificate of Conformity (CoC), enabling smooth customs clearance at Botswana ports and borders."
  - type: "checklist"
    value:
      heading: "What you give us"
      text: ""
      form_label: "Start the request form"
      schema: "program_request"
      items:
      - "Final / proforma invoice: detailing the goods, value, and shipment information"
      - "Conformity documents: test reports, quality certificates, and analysis reports provided by exporters as per technical requirements"
      - "Packing list: complete list of items in the shipment"
      - "Product details and specifications: technical descriptions and model information"
      - "Application form: signed and duly filled"
  - type: "labelling"
    value:
      heading: "Applicable standards, in priority order"
      items:
      - "Botswana Standards (BOBS): the primary reference standards published by the Botswana Bureau of Standards."
      - "International standards: ISO, IEC, or other internationally recognized standards where BOBS standards are unavailable."
      - "National standards: standards from the exporter's country of origin, where applicable."
      - "Manufacturer specifications: used only in the absence of BOBS, international, and national standards applicable to the product."
  - type: "fees"
    value:
      heading: ""
      mode: ""
      note: ""
  - type: "qa"
    value:
      heading: "Questions exporters ask"
      questions:
      - question: "What is a Botswana Certificate of Conformity (CoC)?"
        answer: "<p>A Botswana Certificate of Conformity (CoC) is a mandatory document issued for regulated products exported to Botswana. It verifies that your products comply with applicable Botswana Standards (BOBS) and technical regulations. The CoC is required for customs clearance at Botswana ports and borders.</p>"
      - question: "What is the Botswana SCSR program?"
        answer: "<p>The Standards (Compulsory Standards) Regulations (SCSR) of 2023 is a Botswana Bureau of Standards (BOBS) program that controls the quality of regulated products imported into and manufactured in Botswana. All regulated products must undergo conformity assessment and obtain a Certificate of Conformity (CoC) or Product Certificate (PC).</p>"
      - question: "Which products require a Botswana CoC?"
        answer: "<p>Regulated product categories under the Botswana SCSR include Mechanical Products, Food Products, Agricultural Products, Electrical Products, Chemical Products, Automotive Products, and Building and Construction Products (Cement). A comprehensive list is available on this page.</p>"
      - question: "How do I get a Botswana CoC?"
        answer: "<p>To obtain a Botswana CoC, you must submit an application to an approved service provider like TIC, along with documents including a proforma invoice, test reports, packing list, and product details. TIC will conduct a conformity assessment and issue the CoC for smooth customs clearance.</p>"
      - question: "Is TIC appointed by BOBS for the Botswana CoC program?"
        answer: "<p>Yes. TIC has been appointed by the Botswana Bureau of Standards (BOBS) to operate the Certificate of Conformity (CoC) / SCSR program. This is TIC's first contract in Africa.</p>"
      - question: "What is the validity of a Botswana CoC?"
        answer: "<p>The validity of a Botswana CoC depends on the certification route. Product Certificates (PCs) are valid for three months for high-risk products and six months for low-risk products. Each CoC covers a specific consignment.</p>"
      - question: "What happens if I ship without a Botswana CoC?"
        answer: "<p>Regulated products arriving at Botswana ports or borders without a valid CoC are subject to possible delays, penalties, or refusal of entry. The CoC is a mandatory customs clearance document in Botswana.</p>"
      - question: "How long does it take to get a Botswana CoC?"
        answer: "<p>The timeline for CoC issuance depends on the completeness of your documents and the product type. TIC aims to process applications as quickly as possible to minimize supply chain disruptions.</p>"
