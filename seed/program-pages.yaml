# Program pages with the text of the current site, ticqc.ae (T43, D82; Darya, Nov 22,
# 2026: the current site's data is true and genuine). Loaded by `seed_site` after the
# pages of en.yaml (programs.pages), in the same shape as the Iraq entry there.
#
# - Egypt: the current site says "appointed by GOEIC"; the public GOEIC register and the
#   accreditations table say "registered" (record 73). The page uses the register's word.
# - Botswana and Libya: the appointment is as the current site states it.
# - `held`: a page that is not loaded. Saudi Arabia SFDA: the current site says
#   "designated body", the plan and the Programs index say "Designation in progress".
#   It is loaded when a director confirms the designation (P-13).
# - No source names the office that owns a program: `owning_office` is empty.
program_pages:
- slug: "egypt-certificate-of-conformity"
  title: "Egypt Certificate of Conformity"
  source:
  - "https://ticqc.ae/egypt-coc/"
  intro: "The Egypt Certificate of Conformity (CoC) is an official document that certifies a product meets the applicable Egyptian standards and technical regulations before it is allowed to enter the country. The CoC is issued after a Pre-Shipment Inspection (PSI), documentary review, and/or laboratory testing of the goods at the country of origin."
  country: "Egypt"
  summary: "Pre-Shipment Inspection, testing and Certificate of Conformity (CoC) for goods exported to the Arab Republic of Egypt, under the GOEIC program."
  regulator_name: "General Organization for Export and Import Control"
  regulator_abbreviation: "GOEIC"
  appointment_status: "registered"
  appointment_reference: "record 73"
  request_label: "Request a certificate"
  parts:
  - type: "appointment"
    value:
      heading: "Registered with GOEIC"
      text: "<p>The Egypt CoC program is implemented by the General Organization for Export and Import Control (GOEIC), the official Egyptian government body responsible for regulating and overseeing the quality and safety of imported goods. GOEIC operates under the Ministry of Trade and Industry.</p><p>GOEIC is the official authority responsible for:</p><ul><li>Setting and updating the list of regulated product categories requiring a CoC</li><li>Appointing international inspection and certification bodies authorized to issue CoCs</li><li>Overseeing the quality assurance of goods imported into and exported from Egypt</li><li>Enforcing compliance at Egyptian ports and border crossings</li><li>Coordinating with international standards bodies to align Egypt's requirements with global benchmarks</li></ul><p>TIC Quality Control is registered with GOEIC to conduct Pre-Shipment Inspections and issue Certificates of Conformity for goods destined for Egypt from any country of origin worldwide.</p>"
  - type: "who_must_comply"
    value:
      heading: "Regulated products"
      text: "All goods in the categories below require a valid Certificate of Conformity before import clearance into Egypt. Goods that do not fall within any regulated category are not subject to the pre-shipment CoC requirement. The regulated products list is periodically updated, so exporters should verify the current scope with TIC before assuming their products are exempt."
      products:
      - group: "Cosmetics, personal care and hygiene products"
        examples: "Skincare products (creams, lotions, serums), hair care products (shampoos, conditioners, dyes), makeup and colour cosmetics, deodorants and antiperspirants, nail care products, baby care cosmetics"
        standard: "EOS cosmetics standards, GCC cosmetics regulations (for formulation safety)"
      - group: "Electrical and electronic household appliances"
        examples: "Washing machines, refrigerators, air conditioners, microwave ovens, electric cookers, dishwashers, vacuum cleaners, electric fans, water heaters and many other household devices"
        standard: "IEC 60335 series (household appliances), IEC 60065 (audio/video equipment), Egyptian equivalent ES standards"
      - group: "Lighting devices and cables"
        examples: "LED lamps, energy-saving compact fluorescent lamps (CFLs), fluorescent tubes, luminaires, insulated wires, low-voltage electrical cables"
        standard: "Cables and wires: IEC 60227, IEC 60245 series"
      - group: "Iron, steel and construction materials"
        examples: "Steel bars and rods for reinforcement, structural steel sections, iron pipes and fittings, welding wires and related construction materials"
        standard: "ES 262 (steel bars), ISO 6935, relevant structural standards"
      - group: "Textiles, clothing and apparel"
        examples: "Ready-to-wear garments for men, women and children, home textiles (bed linen, towels, curtains), technical textiles, fabrics"
        standard: "OEKO-TEX / REACH compliance for restricted substances, ES labelling requirements"
      - group: "Personal protective equipment (PPE)"
        examples: "Safety helmets, high-visibility clothing, protective gloves, safety footwear, respiratory protective devices, eye and face protection, fall protection equipment"
        standard: "EN 340, EN 388, EN 397, EN ISO 20345 series"
      - group: "Children's toys"
        examples: "All imported toys, including electronic toys"
        standard: "EN 71 series (European Toy Safety Standard), ISO 8124 series"
      - group: "Footwear and leather goods"
        examples: "Casual shoes, sports shoes, safety shoes, sandals, leather bags, belts and accessories"
        standard: ""
      - group: "Paper products"
        examples: "Diapers and nappies, feminine hygiene / sanitary pads, toilet paper and tissue, wet wipes"
        standard: ""
      - group: "Tiles, ceramics, marble and granite"
        examples: "Floor and wall tiles, ceramic products, marble slabs, granite tiles"
        standard: "ISO 13006 and equivalent Egyptian standards"
      - group: "Sanitary ware and plumbing"
        examples: "Sinks, washbasins, toilet seats, shower cabins and trays, faucets, mixers, plumbing fittings"
        standard: ""
      - group: "Furniture"
        examples: "Home and office furniture including sofas, beds, wardrobes, office chairs, desks and storage units"
        standard: ""
      - group: "Bicycles, scooters and motor vehicles"
        examples: "Bicycles, electric bikes (e-bikes), kick scooters, electric scooters, motorbikes, motor vehicles"
        standard: ""
      - group: "Batteries"
        examples: "Primary (dry) batteries, sealed lead-acid batteries, traction batteries (golf cart batteries)"
        standard: ""
      - group: "Additional regulated product categories"
        examples: "Kitchen utensils and tableware, perfume and fragrance products, oral and dental health products, soaps, disinfectants and cleaning products, food contact materials and packaging"
        standard: ""
      - group: "Additional regulated product categories (continued)"
        examples: "Kitchen appliances (pressure cookers, blenders, kettles), air fresheners, glassware, locks and security fittings, LPG valves and low-pressure regulators"
        standard: ""
      - group: "Additional regulated product categories (continued)"
        examples: "Carpets and floor coverings, artificial grass, wristwatches and clocks, pallets, shaving and hair care devices"
        standard: ""
  - type: "routes"
    value:
      heading: "Registered or unregistered goods"
      text: "The process differs slightly depending on whether your products are already registered under the GOEIC system or are being certified for the first time as unregistered goods. For exporters who regularly ship the same products to Egypt, GOEIC offers a Registration pathway that simplifies the ongoing CoC process."
      button_label: "Find my route"
      questions:
      - question: "Are your products already registered under the GOEIC system (you hold a valid Statement of Registration)?"
        answers:
        - answer: "Yes"
          outcome: "registered goods: SoR verification and monitoring, then a CoC for each conforming shipment"
          route: "registered"
        - answer: "No, first-time certification"
          outcome: "unregistered goods: Request for Certification, documentary review / testing, inspection (PSI), certificate"
          route: "unregistered"
        - answer: "No, I ship the same products regularly"
          outcome: "application for registration: Request for Registration (RFR), verification, Statement of Registration (SoR)"
          route: "registration"
  - type: "steps"
    value:
      heading: "How it works"
      steps:
      - title: "Request for Certification (RFC)"
        text: "The exporter or their authorized representative submits a formal Request for Certification (RFC) to TIC. The RFC form (TIC-IMS-EGY-FRM-25-01) must be completed with full details of the shipment: product description, HS codes, manufacturer details, country of origin, exporter and importer information, and the relevant Egyptian standard(s) to be assessed against."
      - title: "Documentary review"
        text: "TIC's technical team reviews the submitted documentation to verify the product's conformity on paper before any physical inspection."
      - title: "Laboratory testing"
        text: "If valid third-party test reports are not available, or if the documentary review identifies gaps, representative product samples are sent to an accredited laboratory for testing against the applicable Egyptian standard(s). TIC works with an extensive network of ISO/IEC 17025-accredited laboratories globally."
      - title: "Pre-Shipment Inspection (PSI)"
        text: "A Pre-Shipment Inspection (PSI) is conducted at the exporter's facility or warehouse, typically once the goods are packed and ready for shipment. The PSI provides the physical evidence that the goods actually conform to the specifications declared in the documents."
      - title: "Certificate of Conformity issuance"
        text: "Upon successful completion of documentary review, testing (where applicable), and PSI, TIC issues the official Certificate of Conformity (CoC) for the shipment. The CoC is transmitted electronically to GOEIC's system and provided to the exporter for inclusion in the shipping documents."
      - title: "Egypt border inspection"
        text: "Upon arrival in Egypt, the shipment is subject to border inspection by GOEIC at the port of entry. Customs clearance is conditional on presentation of a valid CoC. In many cases, a valid CoC significantly expedites the border inspection process, as the pre-shipment verification provides assurance to GOEIC inspectors."
  - type: "checklist"
    value:
      heading: "What you give us"
      text: "Preparing your documentation correctly from the outset is the single most effective way to accelerate your CoC process."
      form_label: "Start the request form"
      schema: "program_request"
      items:
      - "Completed RFC form (TIC-IMS-EGY-FRM-25-01): initiates the certification process. All shipments."
      - "Commercial invoice: confirms shipment value and details. All shipments."
      - "Packing list: details quantities, weights, dimensions. All shipments."
      - "Product technical data sheet / specifications: defines product composition and characteristics. All shipments."
      - "Existing test reports (ISO/IEC 17025 accredited): evidence of product compliance with standards. Where available."
      - "Product labels / artwork: verification of labelling compliance. All regulated products."
      - "Bill of lading / AWB: shipment identification. Post-loading CoCs."
      - "ISO 9001 or equivalent quality certificate: evidence of manufacturer's quality systems. Registration process."
      - "MSDS / safety data sheet: chemical product safety information. Chemical / cosmetic products."
      - "Any previous CoCs for the same product."
  - type: "labelling"
    value:
      heading: "Testing, inspection and labelling"
      items:
      - "Egypt has specific labelling requirements for most regulated product categories, including requirements for Arabic language labelling, country of origin marking, safety warnings, and content/composition declarations."
      - "Non-compliant labels are a very common reason for a Non-Conformity Report (NCR). Review Egypt's labelling requirements for your product category with TIC before production or at least before final packaging."
      - "The Pre-Shipment Inspection involves visual and physical examination of the goods, verification of quantities and packing against the shipping documents, checking of product markings and labels, and sampling for testing (if required)."
      - "Egyptian standards are developed and published by the Egyptian Organization for Standardization and Quality (EOS). Egyptian Standards (ES) are largely harmonized with international standards, particularly ISO, IEC, and EN standards."
      - "For products where no specific Egyptian standard exists, GOEIC may accept internationally recognized standards such as ISO, IEC, EN, ASTM, or JIS as the applicable conformity benchmark."
      - "Test reports must be from ISO/IEC 17025-accredited laboratories, cover the current version of the applicable standard, and be within the accepted validity period (typically 3 years)."
      - "Cosmetics, personal care and hygiene products must demonstrate compliance with Egyptian chemical safety standards, labelling requirements, and ingredient restrictions."
      - "Electrical and electronic household appliances are assessed for electrical safety, electromagnetic compatibility (EMC), and energy efficiency in accordance with applicable Egyptian standards (ES) and equivalent international standards."
      - "Lighting devices and cables are tested for electrical safety, insulation quality, fire resistance, and compliance with Egyptian electrical standards."
      - "Iron, steel and construction materials are tested to verify mechanical properties, chemical composition, dimensional tolerances, and compliance with Egyptian building standards."
      - "Textiles and clothing must comply with Egyptian labelling regulations, fibre composition requirements, and safety standards. Testing typically covers fibre content analysis, colourfastness, dimensional stability, and chemical safety."
      - "Personal protective equipment (PPE) must meet the relevant EN or ISO standards that Egypt has adopted."
      - "Toys must be tested for mechanical and physical safety (sharp edges, small parts, tension), chemical safety (heavy metals, phthalates, formaldehyde), flammability, electrical safety (for electronic toys), and age-appropriate labelling."
      - "Footwear and leather goods: testing covers material composition, restricted chemical substances, labelling compliance, and physical performance criteria."
      - "Paper products are assessed for hygiene safety, chemical composition, and compliance with Egyptian consumer product standards."
      - "Tiles, ceramics, marble and granite: testing covers dimensional tolerances, water absorption, breaking strength, surface quality, chemical resistance, and slip resistance properties."
      - "Sanitary ware and plumbing products must meet Egyptian standards for dimensional accuracy, material quality, water efficiency, and chemical safety."
      - "Furniture: relevant standards cover structural stability, material safety (formaldehyde emissions from wood-based panels, restricted flame retardants), surface durability, and labelling."
      - "Bicycles, scooters and motor vehicles require assessment of safety features, braking performance, lighting, reflectors, mechanical strength, and compliance with applicable road safety standards."
      - "Batteries: testing covers electrochemical performance, safety under short-circuit and overcharge conditions, labelling, and chemical composition."
  - type: "fees"
    value:
      heading: ""
      mode: ""
      note: ""
  - type: "qa"
    value:
      heading: "Questions exporters ask"
      questions:
      - question: "What is the Egypt CoC?"
        answer: "<p>The Egypt Certificate of Conformity (CoC) is an official document that certifies a product meets the applicable Egyptian standards and technical regulations before it is allowed to enter the country. The CoC is issued after a Pre-Shipment Inspection (PSI), documentary review, and/or laboratory testing of the goods at the country of origin, before the shipment leaves the exporter's facility.</p><p>Without a valid CoC, goods may be held at Egyptian ports, subjected to additional inspections by customs authorities, or refused entry entirely.</p>"
      - question: "Why was the Egypt CoC program introduced?"
        answer: "<p>Egypt introduced the mandatory Verification of Conformity (VoC) / CoC program to address several key challenges in its import trade environment:</p><ul><li>Prevent the influx of substandard, counterfeit, and non-compliant goods into the local market</li><li>Protect Egyptian consumers from safety hazards posed by low-quality imported products</li><li>Safeguard domestic industries from unfair competition from cheap, non-compliant imports</li><li>Align Egypt's import control framework with international quality assurance best practices</li><li>Facilitate faster and more predictable customs clearance for compliant exporters</li><li>Reduce the burden on Egyptian border inspection authorities by shifting quality checks to the country of export</li></ul><p>The program has been progressively expanded over the years to cover an increasingly wide range of product categories.</p>"
      - question: "Is a CoC mandatory for all goods exported to Egypt?"
        answer: "<p>No. The Egypt CoC requirement applies specifically to the product categories listed under the GOEIC regulated products list. Goods that do not fall within any regulated category are not subject to the pre-shipment CoC requirement. However, the regulated products list is periodically updated, so exporters should verify the current scope with TIC before assuming their products are exempt.</p>"
      - question: "How long does the Egypt CoC process take?"
        answer: "<p>The timeline varies depending on the product category, the completeness of documentation, and whether laboratory testing is required. For well-documented shipments of products with existing valid test reports, the CoC process can be completed in as few as 3-5 working days. Where new laboratory testing is required, the overall timeline may extend to 2-6 weeks depending on the test parameters and laboratory availability. TIC will provide a realistic timeline estimate at the outset of your application.</p>"
      - question: "Can the CoC be obtained after the goods have been shipped?"
        answer: "<p>The Egypt CoC program is fundamentally a Pre-Shipment Inspection program: the CoC is intended to be obtained before the goods leave the country of origin. In exceptional circumstances and with GOEIC's authorization, post-shipment certification may be possible, but this is not the standard process and may result in complications at Egyptian customs. TIC strongly recommends initiating the CoC process well in advance of your planned shipment date.</p>"
      - question: "Does the CoC need to be in Arabic?"
        answer: "<p>The CoC issued by TIC is produced in a standardized format that is accepted by Egyptian customs. Certain accompanying documents (such as product labels) may require Arabic language content. TIC will advise on the specific language requirements for your product category and shipment documents.</p>"
      - question: "How long is a CoC valid?"
        answer: "<p>A CoC is typically issued for a specific shipment and is valid for the customs clearance of that shipment. It is not a product approval that covers all future shipments: each new shipment requires its own CoC. However, registered goods under a valid Statement of Registration (SoR) benefit from a simplified and faster CoC issuance process for subsequent shipments.</p>"
      - question: "What happens if my goods fail the inspection or testing?"
        answer: "<p>If your goods are found non-conforming during the PSI or testing, TIC will issue a Non-Conformity Report (NCR) detailing the specific non-conformances identified. You will have the opportunity to undertake corrective actions (rework, replacement, re-testing) and request a follow-up inspection. TIC's technical team will support you through the corrective action process. No CoC will be issued until conformity has been demonstrated.</p>"
      - question: "Do I need a CoC if I already have an ISO 9001 certificate?"
        answer: "<p>ISO 9001 certification demonstrates that your quality management system meets the ISO 9001 standard, but it does not replace the product-specific CoC requirement for Egypt. The Egypt CoC certifies that specific products in a specific shipment meet the applicable Egyptian product standards: this is a product conformity assessment, distinct from a management system certification. Both may be relevant, and ISO 9001 certification may support the registration process, but it does not exempt you from the CoC requirement.</p>"
      - question: "Can TIC help with both the CoC and the product registration (SoR)?"
        answer: "<p>Yes. TIC provides support for both the shipment-level CoC process and the product registration process leading to a Statement of Registration (SoR). Our team can advise you on whether registration is appropriate for your products and export volumes, and guide you through the full registration process from initial application through verification and SoR issuance.</p>"
      - question: "How does product registration (Statement of Registration, SoR) work?"
        answer: "<p>For exporters who regularly ship the same products to Egypt, GOEIC offers a Registration pathway that simplifies the ongoing CoC process. Once a product is registered, subsequent shipments benefit from a streamlined verification and monitoring process.</p><p><b>Step 1: Request for Registration (RFR).</b> The manufacturer or exporter submits a Request for Registration (RFR) through TIC. This involves providing comprehensive product and manufacturing facility documentation for GOEIC's review.</p><p><b>Step 2: Verification.</b> TIC conducts a thorough verification process that may include factory inspection (assessment of the manufacturer's quality management systems and production processes), product testing against Egyptian standards, and full documentary review.</p><p><b>Step 3: Statement of Registration (SoR).</b> Upon successful verification, GOEIC issues a Statement of Registration (SoR) for the product. The SoR is valid for a defined period and confirms that the product and its manufacturing process have been assessed and found compliant.</p><p><b>Registered goods workflow.</b> Once a product holds a valid SoR, subsequent shipments follow a simplified workflow: TIC conducts ongoing SoR verification and monitoring (which may include periodic factory audits, surveillance testing, and shipment verification), and issues a CoC for each conforming shipment. This registered goods workflow is significantly faster than the full first-time certification process.</p>"
      - question: "What are the common reasons for CoC rejection, and how can exporters avoid them?"
        answer: "<p><b>1. Incomplete or inaccurate documentation.</b> Missing documents, inconsistencies between the commercial invoice and packing list, incorrect HS codes, or incomplete product descriptions are among the most frequent causes of certification delays. Solution: engage with TIC early in the export planning process to ensure your documentation package is complete and accurate before the inspection is scheduled.</p><p><b>2. Non-compliant product labelling.</b> Egypt has specific labelling requirements for most regulated product categories, including requirements for Arabic language labelling, country of origin marking, safety warnings, and content/composition declarations. Solution: review Egypt's labelling requirements for your product category with TIC before production or at least before final packaging.</p><p><b>3. Products not meeting Egyptian standards.</b> Products that perform acceptably in other markets may not meet the specific Egyptian standard requirements, particularly where Egypt has adopted more stringent limits than other countries for certain parameters (e.g., chemical restrictions in cosmetics or textiles, mechanical performance of construction materials). Solution: obtain a pre-assessment from TIC's technical team to identify any potential compliance gaps before you commit to producing or shipping the goods.</p><p><b>4. Outdated or non-accredited test reports.</b> Test reports that are outdated, issued by non-accredited laboratories, or that do not cover the full scope of the applicable standard will not be accepted for the documentary review. Solution: ensure all test reports submitted are from ISO/IEC 17025-accredited laboratories, cover the current version of the applicable standard, and are within the accepted validity period (typically 3 years).</p><p><b>5. Goods not matching approved samples or specifications.</b> If the goods inspected during the PSI differ materially from the specifications or samples previously assessed during testing, a non-conformity will be raised. This can happen due to production changes, substitution of materials, or manufacturing variations. Solution: maintain tight production controls and notify TIC promptly of any changes to product specifications or manufacturing processes.</p>"
