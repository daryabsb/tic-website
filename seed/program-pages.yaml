- slug: "saudi-arabia-sfda"
  title: "Saudi Arabia SFDA: food and cosmetics"
  source:
  - "https://ticqc.ae/sfda-food-cosmetics-certification-saudi-arabia/"
  intro: "TIC Quality Control provides independent conformity assessment and certification services for food and cosmetic consignments exported to the Kingdom of Saudi Arabia in accordance with the requirements of the Saudi Food and Drug Authority (SFDA). Certificates are issued electronically via the official SFDA FASAH platform."
  country: "Saudi Arabia"
  summary: "Conformity assessment and Certificate of Conformity (CoC) issuance for food and cosmetic consignments entering the Saudi market, through the SFDA FASAH platform."
  regulator_name: "Saudi Food and Drug Authority"
  regulator_abbreviation: "SFDA"
  appointment_status: "appointed"
  fact_status_note: "Designated certification body under SFDA regulations"
  request_label: "Request a certificate"
  parts:
  - type: "appointment"
    value:
      heading: "SFDA designated body"
      text: "<p>TIC Quality Control operates as a designated certification body under SFDA regulations to implement conformity assessment, evaluation, and issuance of Certificates of Conformity (CoC) for food and cosmetic consignments destined for the Saudi market.</p><p>TIC Quality Control operates under SFDA Conformity Assessment Body (CAB) designation requirements. All certification activities comply with applicable SFDA technical regulations, guidelines, and requirements for food and cosmetic products entering the Saudi market.</p><p>ISO/IEC 17065 is the international standard for bodies certifying products. TIC Quality Control adheres to all ISO/IEC 17065 requirements including impartiality, technical competence, transparency, and documentation standards.</p><p><b>Impartiality and confidentiality.</b> TIC Quality Control operates as an independent certification body ensuring impartiality, integrity, and confidentiality in all certification activities. We maintain complete independence from commercial interests and ensure transparent, equitable treatment for all applicants.</p><ul><li>Impartial assessment: unbiased evaluation of all applications based solely on technical and regulatory criteria.</li><li>Confidentiality: strict protection of all proprietary information and business data throughout the certification process.</li><li>Transparency: clear documentation of all evaluation activities and decision-making processes.</li><li>Integrity: adherence to professional and ethical standards in all operations.</li></ul>"
  - type: "who_must_comply"
    value:
      heading: "Products covered"
      text: "The certification program applies to all food and cosmetic consignments entering the Kingdom of Saudi Arabia. The program is designed to support importers, exporters, manufacturers, and traders in demonstrating compliance with applicable Saudi technical regulations and product safety requirements prior to customs clearance. Each consignment receives individual evaluation and certification. No blanket approvals: each shipment is assessed independently."
      products:
      - group: "Food products"
        examples: "Processed, fresh and chilled, and frozen food products; meat and poultry products; fruits and vegetables; beverages; food ingredients and additives; packaged food products; other food products within the approved certification scope"
        standard: "Applicable SFDA technical regulations and food safety requirements"
      - group: "Cosmetic products"
        examples: "Personal care products, skincare and makeup, hair care products, perfumes and fragrances, all cosmetic categories under SFDA"
        standard: "SFDA cosmetic regulations and safety standards"
