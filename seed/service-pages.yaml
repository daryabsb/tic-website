      value:
        heading: "What is HALAL certification?"
        text: "<p>HALAL Certification is an internationally recognized assurance that products, processes, and services strictly comply with Shariah (Islamic law) requirements. It guarantees that certified items are Halal (permissible), Tayyib (wholesome and hygienic), and free from Haram (prohibited) or Najis (impure) substances.</p><ul><li><b>Halal: permissible.</b> All ingredients, production methods, and handling must be fully permissible under Islamic law throughout the entire supply chain.</li><li><b>Tayyib: wholesome.</b> Products must be wholesome, hygienic, and of the highest quality, safe for consumption and free from contamination.</li><li><b>Free from Haram.</b> No prohibited substances, including pork derivatives, blood, alcohol, or improperly slaughtered animals, anywhere in the product.</li><li><b>Free from Najis.</b> Completely free from all impure substances as defined by Islamic jurisprudence, verified at every stage of production.</li></ul><p><b>Why choose TIC Quality Control HALAL certification.</b> We bring together global recognition, Shariah expertise, and ISO-backed rigour to deliver certification that opens markets worldwide.</p><ul><li><b>Global Recognition.</b> Access international HALAL markets with confidence.</li><li><b>Credibility and Trust.</b> Certification backed by ISO/IEC 17065 standards.</li><li><b>Expert Oversight.</b> Audits conducted by qualified HALAL auditors and Shariah experts.</li><li><b>Comprehensive Scope.</b> Covering meat and meat products, food, beverages, cosmetics, pharmaceuticals, and logistics.</li><li><b>Continuous Assurance.</b> Ongoing surveillance audits to maintain compliance.</li></ul><p>12+ countries covered. ISO/IEC 17065 accredited. 100% Shariah expert review. Ongoing surveillance.</p><p><b>Beyond compliance: global market readiness.</b> By partnering with TIC for HALAL certification, you demonstrate not only religious compliance but also quality assurance and global market readiness. Our certification program is designed to help manufacturers, processors, and service providers build lasting trust with consumers worldwide.</p><p><b>File a complaint.</b> If you have a complaint regarding any aspect of TIC's HALAL certification services, including audit conduct, certification decisions, or customer service, you may submit a formal complaint through our dedicated process. Complete and submit the official Complaints Form. Include all relevant documentation, certificate references, dates, and supporting evidence. Our Complaints Committee reviews and responds within the stipulated timeframe. You will be notified of the outcome with full written reasoning.</p><p><b>File an appeal.</b> If you wish to challenge a certification decision, including denial, suspension, or withdrawal of your HALAL certificate, you have the right to submit a formal appeal reviewed by an independent committee. Submit an appeal in writing, stating the grounds and providing all supporting evidence. The Appeals Committee, independent of the original decision, reviews the case. Where required, additional verification or re-audit may be conducted. A final decision is communicated with full written justification.</p>"
    - type: "who_needs_it"
