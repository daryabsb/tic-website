  marine-and-cargo-surveys:
    source:
    - "https://ticqc.ae/marine/"
    - "https://ticqc.ae/food-inspection/"
    summary: "Draft surveys, ullage surveys, bunker surveys, sealing/unsealing, on/off hire surveys, carrier cleanliness inspections and hose tests, conducted by experienced marine surveyors."
    card_caption: "Marine"
    intro: "Our marine services include draft surveys, ullage surveys, bunker surveys, sealing/unsealing, on/off hire surveys, carrier cleanliness inspections, and hose tests, all conducted by experienced marine surveyors to ensure accuracy, security, and integrity in cargo handling and vessel operations."
    parts:
    - type: "what_it_is"
      value:
        heading: "Our marine services"
        text: "<p><b>Draft survey.</b> The Draft Survey service assists customers in measuring cargo quantity on vessels. Conducted by our experienced marine surveyors, this service is performed both before loading or discharge operations commence and after their completion.</p><p><b>Ullage.</b> Ullage survey is offered to our clients to determine the amount of liquid cargo such as crude oil, petroleum products, chemicals and similar loaded or discharged on tanker ships. In short, it is a volume determination method. Our experienced marine surveyors measure the empty space above the load in the tanks and make some static calculations. In this way, the volume and weight of the cargo carried by the ship is calculated.</p><p><b>Bunker survey.</b> Bunker Survey is a service provided to our clients to measure the quantity of fuel delivered to a vessel during bunkering. Our experienced marine surveyors conduct this survey both before and after bunkering operations to ensure accuracy and transparency in fuel quantities.</p><p><b>On/off hire survey.</b> On/Off Hire Survey is a specialized service we offer to clients when hiring or off hiring a vessel. This independent survey is crucial for parties involved in vessel transactions to assess the vessel’s condition accurately. Our experienced marine surveyors conduct this survey to provide comprehensive information and minimize liabilities for all concerned parties.</p><p><b>Carrier cleanliness inspection.</b> Carrier Cleanliness Inspection is a service provided to ensure that carriers, such as vessels, containers, or trucks, are clean and ready to receive shipments before loading operations. Our experienced inspectors conduct thorough inspections to verify cleanliness standards, helping to maintain the integrity of the cargo and prevent contamination during transportation.</p><p><b>Hose test.</b> Hose test is a service offered to ensure the weatherproof integrity of vessel holds before loading operations. Conducted by our experienced inspectors, this test verifies that vessel holds are secure and prepared to receive intended shipments, minimizing the risk of cargo damage due to weather conditions during transportation.</p><p><b>Damage survey.</b> TIC Quality Control’s food damage survey entails a comprehensive assessment conducted by our experienced inspectors to evaluate the extent of damage, loss, or spoilage in food products. This survey aims to provide objective insights into any damages incurred during transportation, storage, or handling, assisting stakeholders in determining liability, insurance claims, and necessary remedial measures.</p>"
