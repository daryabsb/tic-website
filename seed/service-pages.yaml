        - "Industrial Asset Inspection"
        - "Environmental Monitoring"
    - type: "how_it_works"
      value:
        heading: "Our UAS certification process"
        steps:
        - title: "Application Submission"
          text: "Submit your application along with required technical documents, product specifications, and supporting compliance evidence to initiate the certification process."
          typical: ""
        - title: "Documentary Review"
          text: "Our experts conduct a thorough review of submitted documents including design data, technical manuals, software documentation, and quality management records."
          typical: ""
        - title: "Testing & Evaluation"
          text: "Products undergo comprehensive testing and technical evaluation to verify airworthiness, performance, safety, and compliance with DGCA standards and applicable UAS Certification Scheme requirements."
          typical: ""
        - title: "Inspection"
          text: "On-site inspection of the UAS platform, manufacturing process, quality systems, and operational procedures is conducted to ensure end-to-end conformity with applicable standards."
          typical: ""
        - title: "Certification Issuance"
          text: "Upon successful evaluation, the UAS Certification is issued, enabling your drone to be commercially deployed in compliance with Drone Rules 2021 and DGCA requirements."
          typical: ""
        - title: "Non-Conformity Resolution"
          text: "Where non-conformities are identified during evaluation, our team provides clear guidance on corrective actions required before certification can proceed."
          typical: ""
