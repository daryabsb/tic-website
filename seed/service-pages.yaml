        - "halal-certification"
    - type: "qa"
      value:
        questions:
        - question: "What is UAS Certification?"
          answer: "<p>UAS Certification is a conformity assessment process through which a drone platform is evaluated against applicable DGCA standards and safety requirements under the Drone Rules 2021. It confirms that the UAS meets technical, operational, and safety benchmarks required for commercial deployment in India.</p>"
        - question: "Who needs UAS Certification?"
          answer: "<p>Drone manufacturers, OEMs, startups, and aviation innovators seeking commercial deployment approval under the DGCA regulatory framework in India require UAS Certification. This is especially relevant for entities targeting government procurement, enterprise applications, or regulated airspace operations.</p>"
        - question: "What standards apply to UAS Certification in India?"
          answer: "<p>Applicable standards are defined by DGCA and QCI under the UAS Certification Scheme, aligned with Drone Rules 2021 and the Digital Sky Platform framework. Requirements cover technical design, manufacturing quality, operational safety, and software systems.</p>"
        - question: "How long does the UAS Certification process take?"
          answer: "<p>Processing times vary depending on documentation completeness, product complexity, testing requirements, and inspection scheduling. Our streamlined processes and technically competent evaluators are designed to minimize delays and provide efficient turnaround times.</p>"
        - question: "Does certification guarantee airspace access?"
          answer: "<p>UAS Certification confirms product conformity with applicable standards, which is a prerequisite for commercial deployment. Operational permissions and airspace access may be subject to additional DGCA approvals and Digital Sky Platform requirements applicable to specific operations.</p>"
        - question: "What happens if non-conformities are found?"
          answer: "<p>Where non-conformities are identified during evaluation, our team provides detailed guidance on corrective actions required. After implementing and verifying the corrective actions, the product may be re-evaluated to proceed with certification.</p>"
        - question: "Can startups and small manufacturers apply?"
          answer: "<p>Yes. Our customer-focused approach is designed to support organizations of all sizes — from established manufacturers to startups and research institutions. We provide personalized guidance to simplify the certification journey regardless of organizational scale.</p>"
