# Service pages and group texts with the text of the current site, ticqc.ae (T43, D82;
# Darya, Nov 22, 2026: the current site's data is true and genuine). Loaded by
# `seed_site` on top of the page list of en.yaml (services.groups).
#
# - `groups`: intro and "how" points of a group page; en.yaml wins where it has a text.
# - `service_pages`: one entry per service page, in the shape of the `psi` entry of
#   en.yaml. Only the current site's content: a part it has no text for is empty and
#   the page does not draw it. `source` names the current pages the text is from.
# - A service of en.yaml that is not here has no text on the current site: it stays a
#   draft.
groups:
  testing:
    intro: "TIC Quality Control offers testing for food and agricultural products, electrical and electronic items, hard goods and toys, textiles and clothes, cosmetics and hygiene products, oil and gas, and minerals and metals."
    how_heading: "How testing is done at TIC"
    how_points:
    - "Food and agricultural products: by harnessing a worldwide partners network of Food & Agri testing & laboratories, we offer comprehensive analysis services covering various parameters."
    - "Food and agricultural products: our expert partners labs employ cutting-edge analytical techniques to assess and verify the nutritional value, composition, authenticity, and integrity of both products and ingredients."
    - "Minerals and metals: with our global network and expert partners, we meet testing needs across diverse environments."
    - "Gases: we perform extensive specification testing based on various standards, including international, national, trade, or company-specific ones."
    - "Electrical and electronic products: physical, mechanical, and electrical testing."
  certification:
    intro: "HALAL Certification is an internationally recognized assurance that products, processes, and services strictly comply with Shariah (Islamic law) requirements. Once a conformity assessment is complete, we issue the mandatory certificate required by the authorities of the importing country. In India, we are currently undergoing the QCI approval process to become a UAS Certification Body."
    how_heading: "How certification is done at TIC"
    how_points:
    - "HALAL certification: an independent Certification Decision Committee conducts an impartial review of all audit reports and Shariah findings before issuing the HALAL Certificate."
    - "HALAL certification: regular surveillance audits ensure continued compliance throughout the certification period."
    - "Certificates of conformity: we carry out conformity evaluations before goods are shipped, reviewing and verifying the documents, gathering samples for lab testing when required, and inspecting goods physically."
    - "UAS certification, India: a professional, structured, and time-bound approach to evaluations and certification activities with full transparency at every stage."
    - "If you have a complaint or wish to appeal a certification decision, our dedicated process ensures every case is handled with impartiality and care."
  audits:
    intro: "We perform factory audits. We assess manufacturing capability, quality systems, production processes, equipment, workforce, and export readiness."
  sustainability:
    intro: "Sustainability and ESG services built on the same rigor and independence behind our testing, inspection and certification work: integrated advisory, accounting, assessment, assurance and sustainability solutions for organizations building a more responsible, resilient and transparent business."
    how_heading: "From ESG ambition to measurable business value"
    how_points:
    - "Assess: EcoVadis and ISO 26000."
    - "Advise: ESG strategy and governance."
    - "Measure: GHG accounting and LCA."
    - "Assure: ESG assurance and verification."
    - "Improve: roadmaps and performance."
service_pages:
  food-and-agricultural-testing:
    source:
    - "https://ticqc.ae/testing/"
    - "https://ticqc.ae/dairy-products-cheese-testing/"
    - "https://ticqc.ae/frozen-meat-products-testing-inspection/"
    - "https://ticqc.ae/rice-testing-inspection/"
    summary: "Expert analysis to verify and validate quality and safety parameters at every stage of your food supply chain."
    card_caption: "Food & Agri"
    intro: "Expert analysis to verify and validate quality and safety parameters at every stage of your food supply chain."
    parts:
    - type: "what_it_is"
      value:
        heading: "Food safety and agri testing"
        text: "<p>The modern food industry is driven by safety, quality, authenticity, and nutrition. Consumers desire products that are authentic, nutritious, premium, and secure. Assessments of ingredients, composition, and country of origin are required in order to establish trust with customers.</p><p>Specialized Food &amp; Agri testing services assist businesses in both domestic and global Food &amp; Agri products distribution networks to verify that their goods align with consumer demands, consequently lowering potential hazards, enhancing productivity, and fulfilling satisfaction and trust among consumers. Our solutions ensure the quality, safety and integrity of your food products.</p><p>By harnessing a worldwide partners network of Food &amp; Agri testing &amp; laboratories, we offer comprehensive analysis services covering various parameters. These include identifying contaminants, foodborne pathogens, spoilage organisms, and allergens. Moreover, our expert partners labs employ cutting-edge analytical techniques to assess and verify the nutritional value, composition, authenticity, and integrity of both products and ingredients.</p><p><b>Physical testing.</b> Refers to the testing methods employed to assess various physical properties of food and agricultural products, serving as indicators of their quality and consistency. Commonly tested properties include color, size, thickness, weight, texture, viscosity, and granulation texture, among others.</p><p><b>Chemistry and nutritional analysis.</b> Testing food products &amp; Agri goods is essential to ascertain their freedom from physical, chemical, and biological hazards, ensuring their safety for consumption. Our tests aid in identifying the nutritional composition, macro elements content, and qualitative properties of food supplements. Nutritional testing involves assessing proteins, carbohydrates, fibers, fats, sugars, vitamins, minerals, and an array of phytochemicals. Through Food &amp; Agri chemistry testing, we provide insights into the safety and edibility of goods.</p><p><b>Microbiological testing.</b> We provide systematic methods to help businesses to have better control and track their food supply chain. With a strong focus on response turnaround times, efficiency, urgencies, and specific food safety issues, we are committed to the pursuit of inspecting and handing out fair reports of any food samples coming to our partners laboratories through scientific procedures, and standardized compliance regulations.</p><p>Our Food safety &amp; Agri partners laboratories specialize in biochemical, microbiological, chemical, and sensory analysis for an extensive range of food items and agri cargos.</p><p><b>Dairy products and cheese.</b> Dairy products are an essential part of the global food supply chain, making quality, safety and regulatory compliance critical at every stage of production, processing, storage and distribution. From fresh milk and butter to cheese, yoghurt, cream and milk powder, maintaining consistent product quality is essential for consumer safety and market acceptance.</p><p>TIC Quality Control provides professional testing, inspection and quality control services for dairy products and cheese. Our services help manufacturers, processors, exporters, importers and food businesses evaluate product quality, verify compliance with applicable standards and identify potential quality or safety concerns.</p><p>Through systematic quality assessments and laboratory testing, we support businesses in maintaining product consistency, meeting regulatory requirements and strengthening confidence across domestic and international markets.</p><p>We provide quality assessment and testing support for a wide range of dairy products, including:</p><ul><li>Fresh Milk and Processed Milk</li><li>Cheese and Cheese Products</li><li>Butter and Ghee</li><li>Milk Powder and Dairy Powders</li><li>Yoghurt and Fermented Dairy Products</li><li>Cream and Dairy-Based Creamers</li><li>Condensed and Evaporated Milk</li><li>Ice Cream and Frozen Dairy Desserts</li><li>Whey Powder and Milk Protein Products</li><li>Dairy-Based Food Preparations</li></ul><p>Dairy products require careful evaluation to ensure they meet applicable food safety, quality and composition requirements. Depending on the product type and testing scope, assessments may include:</p><ul><li><i>Physical and Chemical Testing.</i> Evaluation of important product characteristics, including moisture content, fat content, protein, acidity, pH, ash content, total solids and other relevant compositional parameters.</li><li><i>Microbiological Testing.</i> Assessment of microbiological quality and potential contamination through relevant tests for microorganisms such as Salmonella, Listeria monocytogenes, Escherichia coli, Staphylococcus aureus, yeast and mould, depending on the product and applicable requirements.</li><li><i>Contaminant and Residue Testing.</i> Testing for relevant chemical contaminants and residues, which may include heavy metals, veterinary drug residues, pesticide residues and other regulated substances, subject to product requirements and laboratory scope.</li><li><i>Nutritional Composition Analysis.</i> Evaluation of nutritional characteristics such as protein, carbohydrates, fats, sugars, energy value, calcium and other relevant nutritional components for product quality and labelling requirements.</li><li><i>Shelf-Life and Stability Assessment.</i> Evaluation of product stability under specified storage conditions to help businesses understand quality changes, storage performance and appropriate shelf-life requirements.</li></ul><p><i>Cheese testing and quality evaluation.</i> Cheese production involves several stages where quality control plays an important role, from milk selection and processing to fermentation, ripening, packaging and distribution. Our cheese testing and quality assessment services may cover:</p><ul><li>Moisture and Fat Content</li><li>Protein and Salt Content</li><li>pH and Acidity Levels</li><li>Microbiological Quality</li><li>Contaminant and Residue Analysis</li><li>Nutritional Composition</li><li>Product Consistency and Quality</li><li>Shelf-Life and Stability Parameters</li></ul><p>These assessments help cheese manufacturers and suppliers maintain consistent product characteristics and evaluate compliance with relevant product specifications and food safety requirements.</p><p><i>Standards and regulatory compliance.</i> Dairy products entering domestic and international markets must comply with applicable food safety regulations, product standards and importing-country requirements. Depending on the product and destination market, relevant requirements may include Codex Alimentarius standards, applicable ISO standards, national food safety regulations and importing-country technical requirements. TIC helps businesses understand relevant quality and compliance requirements through appropriate testing, inspection and conformity assessment services, subject to the applicable service scope.</p><p><b>Frozen meat products.</b> Frozen meat products require careful quality control at every stage, from processing and packaging to storage and international transportation. Maintaining product safety, quality and compliance with applicable food standards is essential for businesses involved in the global meat trade.</p><p>TIC provides testing, inspection and quality assurance services for frozen meat products to support manufacturers, processors, importers and exporters. Our services help businesses assess product quality, verify specifications and identify potential quality concerns before products reach the market.</p><p>Whether you deal in frozen beef, mutton, lamb, poultry or other frozen meat products, reliable testing and inspection play an important role in maintaining product integrity and meeting buyer and regulatory requirements.</p><p>Different meat products require different quality parameters depending on their composition, processing methods, intended use and applicable market requirements. Our testing and inspection services can cover a range of frozen meat products, including:</p><ul><li>Frozen Beef: Frozen beef cuts, boneless beef, beef cubes and other beef products.</li><li>Frozen Mutton: Frozen mutton cuts, boneless mutton and related meat products.</li><li>Frozen Lamb: Lamb portions, frozen lamb cuts and packaged lamb products.</li><li>Frozen Poultry: Frozen chicken, chicken portions, wings, breast meat and other poultry products.</li><li>Frozen Goat Meat: Frozen goat cuts and boneless goat meat.</li><li>Processed Frozen Meat: Minced meat, meat portions, marinated products and other prepared frozen meat items.</li></ul><p>Testing requirements are determined according to the product type, customer specifications and destination-market regulations.</p><p>Quality testing is an important part of verifying the condition, composition and safety of frozen meat products. Appropriate laboratory analysis helps businesses evaluate product characteristics and assess whether goods meet specified requirements.</p><p><i>Microbiological Testing.</i> Microbiological analysis helps assess the presence of specified microorganisms that may affect food safety and product quality. Depending on the product and applicable requirements, testing may include:</p><ul><li>Total Plate Count (TPC)</li><li>Salmonella</li><li>Escherichia coli (E. coli)</li><li>Listeria monocytogenes</li><li>Staphylococcus aureus</li><li>Other relevant foodborne microorganisms</li></ul><p><i>Chemical Testing.</i> Chemical analysis helps evaluate selected chemical characteristics and potential contaminants in frozen meat products. Testing may include:</p><ul><li>Moisture content</li><li>Protein content</li><li>Fat content</li><li>Ash content</li><li>Chemical contaminants, where applicable</li><li>Relevant food safety parameters</li></ul><p><i>Physical and Quality Assessment.</i> Physical examination\
          \ helps assess the visible and measurable characteristics of frozen meat products. Relevant assessment parameters may include:</p><ul><li>Product appearance and colour</li><li>Odour and general condition</li><li>Texture and consistency</li><li>Foreign matter examination</li><li>Ice glazing and surface condition</li><li>Packaging and labelling condition</li></ul><p><i>Nutritional Composition Analysis.</i> Nutritional analysis helps determine the composition of meat products for product specifications, nutritional declarations and buyer requirements. Depending on the requested scope, this may include protein, fat, moisture and other nutritional parameters.</p><p><i>Importance of frozen meat quality control.</i> Frozen meat products are often transported across long distances and pass through multiple stages of handling and storage. Even when products are maintained under frozen conditions, improper handling, temperature fluctuations or packaging damage can affect their quality. A structured testing and inspection program helps businesses:</p><ul><li>Assess product safety and quality.</li><li>Identify potential microbiological concerns.</li><li>Verify product specifications and composition.</li><li>Evaluate packaging and labelling compliance.</li><li>Assess cold-chain handling practices.</li><li>Reduce the risk of shipment-related quality disputes.</li><li>Support import and export documentation requirements.</li><li>Build confidence among international buyers and suppliers.</li></ul><p><i>Frozen meat export and import quality requirements.</i> International meat trade involves multiple requirements depending on the exporting country, destination market, product category and applicable regulatory framework. Importers and exporters may need to demonstrate conformity with food safety requirements, product specifications, labelling rules and shipment conditions. TIC supports businesses with relevant testing and inspection activities to help assess frozen meat consignments against applicable requirements.</p><p><b>Rice.</b> Rice is one of the world’s most widely consumed staple food commodities and plays a significant role in international agricultural trade. Maintaining consistent quality, grain integrity and food safety is essential for rice millers, processors, traders, importers and exporters.</p><p>TIC provides professional testing, inspection and quality control services for different varieties of rice. Our services help businesses assess grain quality, verify product specifications, identify potential contaminants and address applicable domestic and international trade requirements.</p><p>From paddy and raw rice to milled, polished, parboiled and specialty rice varieties, appropriate quality assessment helps maintain product consistency, reduce trade-related risks and strengthen confidence across the rice supply chain.</p><p>We support quality assessment and inspection requirements for different rice varieties and products, including:</p><ul><li>Basmati Rice</li><li>Non-Basmati Rice</li><li>Raw Rice</li><li>Parboiled Rice</li><li>Brown Rice</li><li>White Rice</li><li>Broken Rice</li><li>Paddy Rice</li><li>Organic Rice</li><li>Long Grain Rice</li><li>Medium Grain Rice</li><li>Short Grain Rice</li><li>Fortified Rice</li><li>Rice Flour and Rice-Based Products</li></ul><p>Rice quality is evaluated through different physical, chemical and safety parameters depending on the variety, product specifications and intended market.</p><p><i>Physical Quality Analysis.</i> Physical examination helps determine grain characteristics, purity and overall product quality. Parameters may include:</p><ul><li>Grain Length and Width</li><li>Average Grain Size</li><li>Broken Rice Percentage</li><li>Damaged and Discoloured Grains</li><li>Foreign Matter</li><li>Immature and Chalky Grains</li><li>Red and Yellow Grains</li><li>Grain Uniformity</li><li>Moisture Content</li></ul><p><i>Chemical Testing.</i> Chemical analysis helps evaluate important rice composition and quality characteristics, which may include:</p><ul><li>Moisture Content</li><li>Protein Content</li><li>Starch Content</li><li>Amylose Content</li><li>Ash Content</li><li>Fat Content</li><li>Acidity and Other Relevant Parameters</li></ul><p><i>Contaminant and Residue Testing.</i> Rice may require testing for relevant chemical contaminants to assess compliance with applicable food safety requirements. Depending on the product and destination market, assessments may include:</p><ul><li>Heavy Metals</li><li>Pesticide Residues</li><li>Mycotoxins</li><li>Aflatoxins</li><li>Other Relevant Chemical Contaminants</li></ul><p><i>Microbiological Testing.</i> Microbiological assessment helps evaluate the hygienic quality of rice and identify potential contamination risks. Relevant testing may include:</p><ul><li>Total Plate Count</li><li>Yeast and Mould</li><li>Salmonella</li><li>Escherichia coli</li><li>Other Relevant Microorganisms</li></ul><p>Testing requirements depend on product characteristics, intended use and applicable standards.</p><p><i>Rice Cooking and Sensory Quality.</i> Cooking and sensory characteristics are important factors in determining rice quality and consumer acceptance. Depending on the product requirements, assessments may include:</p><ul><li>Cooking Quality</li><li>Grain Elongation</li><li>Aroma and Flavour</li><li>Texture and Firmness</li><li>Stickiness</li><li>Appearance After Cooking</li><li>Water Absorption Characteristics</li></ul><p><i>Rice export quality and regulatory compliance.</i> International rice trade requires compliance with applicable food safety regulations, commodity specifications and importing-country requirements. Depending on the rice variety and destination market, relevant requirements may include:</p><ul><li>Codex Alimentarius Standards</li><li>Applicable ISO Standards</li><li>National Food Safety Regulations</li><li>Maximum Residue Limits (MRLs)</li><li>Heavy Metal and Contaminant Limits</li><li>Phytosanitary Requirements</li><li>Importing-Country Quality Specifications</li><li>Packaging and Labelling Requirements</li></ul><p>TIC supports businesses in addressing relevant testing, inspection and conformity assessment requirements for domestic and international rice trade.</p>"
