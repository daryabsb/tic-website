  vehicle-inspection:
    source:
    - "https://ticqc.ae/vehicle-and-automotive-inspection/"
    summary: "We specialize in offering comprehensive third-party inspection services and Certificates of Conformity (COC) for vehicles."
    card_caption: "Vehicles"
    intro: "We specialize in offering comprehensive third-party inspection services and Certificates of Conformity (COC) for vehicles."
    parts:
    - type: "what_it_is"
      value:
        heading: "Third-party vehicle inspection"
        text: "<p>Our third-party inspections involve a thorough and unbiased examination of vehicles to ensure they meet the required standards and regulations. This service helps to identify any potential issues or defects that may affect the vehicle’s performance, safety, or compliance with industry standards.</p><p><b>Vehicle damage survey.</b> A vehicle damage survey is a comprehensive evaluation process conducted to assess the extent and nature of damage sustained by a vehicle. This survey involves a detailed inspection by qualified professionals who meticulously examine various aspects of the vehicle to identify and document any damage.</p>"
    - type: "who_needs_it"
      value:
        heading: ""
        items: []
    - type: "how_it_works"
      value:
        heading: "Essential elements of a vehicle damage survey"
        steps:
        - title: "Initial assessment"
          text: "Visual inspection: the survey begins with a thorough visual inspection of the vehicle’s exterior and interior. This includes checking for dents, scratches, paint damage, and structural issues. Photographic evidence: detailed photographs are taken to document all visible damage, providing a visual record for reference."
          typical: ""
        - title: "Detailed inspection"
          text: "Structural analysis: the vehicle’s frame and chassis are inspected to identify any structural damage, which is crucial for assessing the vehicle’s overall integrity and safety. Mechanical and electrical systems check: key components, including the engine, transmission, braking system, and electronic controls, are examined to detect any damage that might affect the vehicle’s operation."
          typical: ""
        - title: "Assessment of impact"
          text: "Safety assessment: evaluating the impact of the damage on the vehicle’s safety features, such as airbags, seat belts, and crumple zones. Operational impact: assessing how the damage affects the vehicle’s functionality, performance, and reliability."
