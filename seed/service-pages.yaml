  quantity-and-quality-inspection:
    source:
    - "https://ticqc.ae/oil-gas/"
    - "https://ticqc.ae/commodities-consumer-products/"
    - "https://ticqc.ae/tic-agri-services/"
    summary: "High-value bulk goods like oil, chemicals, fuels, and edible oils are measured, tested, and verified for shipment and inventory."
    card_caption: "Commodities"
    intro: "Independent third-party inspections reduce the risk of defects by ensuring products meet customer standards and regulations, protecting your business and ensuring quality delivery."
    parts:
    - type: "what_it_is"
      value:
        heading: "Quality and quantity inspection"
        text: "<p><b>Cargo measurement and quality control.</b> High-value bulk goods like oil, chemicals, fuels, and edible oils are measured, tested, and verified for shipment and inventory. Inspectors sample products from storage tanks, ships, barges, transfer facilities, railcars, and warehouses. TIC Quality Control chemists use industry and regulatory standards to ensure accurate and reliable results.</p><p>TIC delivers global chemical inspection services with 24/7 coordination and reporting at major chemical ports and production areas. Our advanced laboratory network meets ASTM, ISO, and other industry standards.</p><p><b>Inspection process.</b> The inspection process includes OBQ/ROB determination and quantity calculations, ullage gauging of cargo tanks, and bunker surveys. It involves overseeing loading and discharge operations, conducting on/off hire inspections, and ensuring cargo cleanliness through certification. The process also covers sampling and thorough testing of petroleum products, including LPG/LNG and other liquid cargos, with a strong focus on loss prevention and cargo integrity.</p><p><b>Oil and gas shipments.</b> At ports, our services verify the quality and quantity of oil and gas shipments, including crude oil, petroleum products, liquefied natural gas (LNG), and liquefied petroleum gas (LPG), during loading or unloading. Quality checks include testing for density, viscosity, sulfur content, and composition to ensure compliance. Quantity inspection involves precise measurement using calibrated equipment. These inspections uphold transparency, prevent disputes, and maintain transaction integrity.</p><p><b>Custody transfer inspection and bulk petroleum inventory.</b> This service ensures accurate measurement and verification of petroleum products during transfer and storage. It includes tank gauging, bunker surveys, atmospheric monitoring, and product sampling to industry standards. Services also cover tank cleanliness inspections, wall wash procedures, and tanker/offshore lightering. Additional capabilities include auto-sampling, investigation of cargo discrepancies, sampling and transport, additive treatment, and laboratory testing with sample retention. Crude oil rail car services and precise tank calibration further support reliable custody transfer and bulk inventory management.</p><p><b>Independent custody transfer inspection.</b> In the oil and liquid industry, custody transfer involves the exchange of liquid between two parties. It is also referred to as fiscal metering, a term used for transactions where fluids are exchanged or transferred between companies. The transfer can take place through various means, such as ships, tanks, or tankers. With our teams of expert engineers and surveyors, we ensure impartiality and accuracy in the measurement and documentation of the transferred fluids. This also entails accurate fluid measurement before and after the transfer using flowmeter devices.</p><p><b>Fertilizers and minerals.</b> Third-party inspection services for minerals provide impartial evaluations of mineral deposits (urea, phosphate, coal, coke, sulfur, etc.) ensuring they meet quality and quantity specifications. These assessments help verify compliance with industry standards and regulations, fostering trust among buyers and sellers.</p><p><b>Agricultural products.</b> Third-party inspection services for agricultural products (wheat, rice, corn, oilseeds, sugar, cotton) involve independent assessment of product quality, quantity, safety, and compliance with standards. They help ensure fair trade practices and enhance trust between buyers and sellers.</p><p><b>Product inspection services.</b> Grading, sampling and quality verification for grains, oilseeds, feedstuff, spices and soft commodities.</p><p><b>Sampling, visual examination and spot moisture test.</b> Representative sampling and on-site moisture checks give an early, reliable read on cargo condition.</p><p><b>Metals.</b> Third-party inspection services for metals (steel coils, rods and billet, copper, aluminum, etc.) encompass impartial evaluations of metal quality and quantity, verifying adherence to stringent industry standards and specifications. These assessments are instrumental in upholding the integrity of metal products, fostering trust and confidence among stakeholders.</p>"
