# CI (master plan 13, #23). Copied from MLP's ci.yml: lint, migrations, translations,
# tests with coverage, then the production image built and booted with Postgres.
# No Lighthouse/axe/lychee step in V1 (D10).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # postgres:16-bookworm, same digest as deploy/compose.yaml
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_DB: tic
          POSTGRES_USER: tic
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tic -d tic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_ENV: test
      DATABASE_URL: postgres://tic:ci-only-not-a-secret@127.0.0.1:5432/tic
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      # zeneon-cms is a private repo pinned by ssh URL in
      # requirements/base.txt. ZENEON_REPOS_TOKEN is a fine-grained token with read access
      # to both (Contents: read), stored as an Actions secret and a Dependabot secret (#30).
      # Git fetches the ssh URLs over https with it; the runner is thrown away after.
      - name: Let git read the private zeneon repos
        env:
          TOKEN: ${{ secrets.ZENEON_REPOS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::ZENEON_REPOS_TOKEN is not set (read access to zeneon-cms)"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"

      # --no-deps: the lock is complete; pip check proves it (as the Dockerfile does).
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements/dev.txt
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext

      # 1. Lint and format
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

      # 2. No model change without a migration
      - name: makemigrations --check
        run: python manage.py makemigrations --check --dry-run

      # 3. Translations compile. ckb and ar must have no fuzzy or empty entry; en is
      #    the source language (an empty msgstr shows the msgid). PO_STRICT 0 reports
      #    gaps as warnings: the missing KU/AR strings are #27; set it to 1 when #27 closes.
      - name: compilemessages
        run: python manage.py compilemessages --ignore=.venv
      - name: Check .po files for fuzzy or empty entries
        shell: python
        env:
          PO_STRICT: "0"
        run: |
          import os, pathlib, sys
          import polib

          problems = []
          for po_path in sorted(pathlib.Path("locale").rglob("*.po")):
              if po_path.parts[1] == "en":
                  continue
              for entry in polib.pofile(str(po_path)):
                  if entry.obsolete:
                      continue
                  if "fuzzy" in entry.flags or not entry.translated():
                      problems.append(f"{po_path}:{entry.linenum}: {entry.msgid[:60]!r}")
          strict = os.environ.get("PO_STRICT") == "1"
          for line in problems:
              print(f"::{'error' if strict else 'warning'}::{line}")
          print(f"{len(problems)} untranslated or fuzzy entries in ckb/ar.")
          sys.exit(1 if problems and strict else 0)

      # 4. Tests with coverage >= 85% on apps/ (threshold in pyproject.toml)
      - name: pytest
        run: coverage run -m pytest
      - name: coverage report
        run: coverage report

  # 5. Build the production image (no push) and prove it boots: the build itself runs
  #    compilemessages and collectstatic against the production settings. The boot
  #    smoke test (migrate, up --wait web, /healthz/) returns with the staging ticket #7.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile fetches the private zeneon repos with the build secret gh_token
      # (ZENEON_REPOS_TOKEN, read access to zeneon-cms). The token
      # is mounted for one RUN only and never written to a layer.
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          secrets: |
            gh_token=${{ secrets.ZENEON_REPOS_TOKEN }}
          push: false
          load: true
          tags: tic-website:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: docker image ls tic-website:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

