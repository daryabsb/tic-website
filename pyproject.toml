# Tool configuration only; dependencies are locked in requirements/*.txt (pip-tools).

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "e2e", "seed"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated by makemigrations.
"**/migrations/*" = ["E501"]
# Tests assert and run subprocesses by design.
"tests/**" = ["S101", "S105", "S603"]
# The font build script downloads from a pinned GitHub commit.
"scripts/**" = ["S310", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "tic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["apps"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
